name: QA e publicação

on:
  push:
    branches: [main, beta, v5]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Tipos (svelte-check + tsc)
        run: npm run check
      - name: Testes
        run: npm run test
      - name: Build
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: dist }

  publicar:
    if: github.ref == 'refs/heads/main'
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
