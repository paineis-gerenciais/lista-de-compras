/* ---------- B1: interpretação de "2kg tomate" ---------- */
const UNIT_ALIASES = {
  kg:'kg', quilo:'kg', quilos:'kg', kilo:'kg', kilos:'kg', k:'kg',
  g:'g', grama:'g', gramas:'g', gr:'g',
  l:'L', litro:'L', litros:'L', lt:'L',
  ml:'ml',
  un:'un', unidade:'un', unidades:'un', und:'un', uni:'un',
  pacote:'pacote', pacotes:'pacote', pct:'pacote', pc:'pacote',
  caixa:'caixa', caixas:'caixa', cx:'caixa',
  dz:'dz', duzia:'dz', duzias:'dz',
  lata:'un', latas:'un', garrafa:'un', garrafas:'un', pote:'un', potes:'un'
};
const UNIT_WORDS = Object.keys(UNIT_ALIASES).sort((a,b)=> b.length - a.length);

function stripAccents(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function normalizeName(s){
  return stripAccents(String(s || '')).toLowerCase().replace(/\s+/g,' ').trim();
}
function titleCaseFirst(s){
  const t = String(s || '').trim();
  if(!t) return t;
  return t.charAt(0).toUpperCase() + t.slice(1);
}

/* Devolve { name, qty, unit, category }. É pura — testável fora do navegador. */
function parseQuickItem(raw){
  let text = String(raw || '').trim().replace(/\s+/g,' ');
  const result = { name:'', qty:'1', unit:'', category:'' };
  if(!text) return result;

  // categoria explícita ao fim, entre parênteses ou após "#": "queijo #frios"
  const catMatch = text.match(/[#(]\s*([^)#]+?)\s*\)?$/);
  if(catMatch && catMatch[1] && catMatch[1].length <= 24){
    result.category = titleCaseFirst(catMatch[1].trim());
    text = text.slice(0, catMatch.index).trim();
  }

  // "2x leite" / "2 x leite" — o "x" é multiplicador, não unidade
  const xForm = text.match(/^(\d+(?:[.,]\d+)?)\s*x\s+(.+)$/i);
  if(xForm){
    result.qty = String(parseFloat(xForm[1].replace(',', '.')));
    result.name = titleCaseFirst(stripLeadingDe(xForm[2]));
    return result;
  }

  // "2kg tomate" / "2 kg tomate" / "500g queijo" / "3 leite" / "1,5L refri"
  const lead = text.match(/^(\d+(?:[.,]\d+)?)\s*([a-zA-Zà-úÀ-Ú]*)\s+(.+)$/);
  if(lead){
    const num = lead[1].replace(',', '.');
    const maybeUnit = normalizeName(lead[2]);
    const rest = lead[3];
    if(maybeUnit && UNIT_ALIASES[maybeUnit]){
      result.qty = String(parseFloat(num));
      result.unit = UNIT_ALIASES[maybeUnit];
      result.name = titleCaseFirst(stripLeadingDe(rest));
      return result;
    }
    if(!maybeUnit){
      result.qty = String(parseFloat(num));
      result.name = titleCaseFirst(stripLeadingDe(rest));
      return result;
    }
    // "2 pacotes arroz" já cai no primeiro caso; aqui a palavra não é unidade
    result.qty = String(parseFloat(num));
    result.name = titleCaseFirst(stripLeadingDe(lead[2] + ' ' + rest));
    return result;
  }

  // "tomate 2kg" (quantidade ao final)
  const trail = text.match(/^(.+?)\s+(\d+(?:[.,]\d+)?)\s*([a-zA-Zà-úÀ-Ú]*)$/);
  if(trail){
    const maybeUnit = normalizeName(trail[3]);
    if(!maybeUnit || UNIT_ALIASES[maybeUnit]){
      result.qty = String(parseFloat(trail[2].replace(',', '.')));
      result.unit = maybeUnit ? UNIT_ALIASES[maybeUnit] : '';
      result.name = titleCaseFirst(trail[1]);
      return result;
    }
  }

  result.name = titleCaseFirst(text);
  return result;
}
function stripLeadingDe(s){
  return String(s).replace(/^de\s+/i, '');
}

/* Casa primeiro pelo nome inteiro, depois palavra a palavra (da mais longa
   para a mais curta), para "peito de frango" cair em Açougue e não em Outros. */
function guessCategory(name){
  const n = normalizeName(name);
  if(!n) return '';
  if(CATEGORY_DICT[n]) return CATEGORY_DICT[n];
  // tenta n-gramas decrescentes
  const words = n.split(' ');
  for(let size = Math.min(3, words.length); size >= 1; size--){
    for(let i = 0; i + size <= words.length; i++){
      const gram = words.slice(i, i+size).join(' ');
      if(CATEGORY_DICT[gram]) return CATEGORY_DICT[gram];
    }
  }
  // singular grosseiro: "tomates" → "tomate"
  for(let i=0;i<words.length;i++){
    const w = words[i];
    if(w.length > 3 && w.endsWith('s')){
      const sing = w.slice(0,-1);
      if(CATEGORY_DICT[sing]) return CATEGORY_DICT[sing];
    }
  }
  // se o usuário já classificou esse item antes, a escolha dele vale mais
  const hist = state.itemHistory && state.itemHistory[n];
  if(hist && hist.category) return hist.category;
  return '';
}

/* ---------- B3: ditado por voz ---------- */
function speechSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);
}
let recognition = null;
function startVoiceCapture(list, btn, input){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; btn.classList.remove('rec'); return; }
  recognition = new SR();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = false;
  btn.classList.add('rec');
  btn.setAttribute('aria-label','Parar de ditar');
  announce('Ouvindo. Diga os itens separados por vírgula.');
  recognition.onresult = (ev)=>{
    const text = Array.from(ev.results).map(r=>r[0].transcript).join(' ');
    // "arroz, feijão e café" → três linhas
    const normalized = text.replace(/\s+e\s+/gi, '\n').replace(/,/g, '\n');
    const n = addItemsFromText(list, normalized);
    if(n){
      trackEvent('item_added', { origin:'voz', qtd:n });
      render();
      showToast(n === 1 ? '1 item adicionado por voz' : n + ' itens adicionados por voz');
    } else if(input){
      input.value = text;
    }
  };
  recognition.onerror = (e)=>{
    if(e.error === 'not-allowed') showToast('Permissão de microfone negada');
    else if(e.error !== 'aborted') showToast('Não consegui ouvir. Tente de novo.');
  };
  recognition.onend = ()=>{
    recognition = null;
    const b = document.getElementById('quickMicBtn');
    if(b){ b.classList.remove('rec'); b.setAttribute('aria-label','Ditar itens por voz'); }
  };
  try{ recognition.start(); }
  catch(e){ recognition = null; btn.classList.remove('rec'); }
}

/* ---------- C3: ordem dos corredores ---------- */
function aisleKeyFor(list){
  if(list && list.location && list.location.type === 'address' && list.location.value){
    return 'loja:' + normalizeName(list.location.value);
  }
  return '__default__';
}
function getAisleOrder(list){
  const entry = state.aisleOrders && state.aisleOrders[aisleKeyFor(list)];
  return (entry && Array.isArray(entry.order)) ? entry.order : null;
}
function setAisleOrder(list, order){
  if(!state.aisleOrders) state.aisleOrders = {};
  state.aisleOrders[aisleKeyFor(list)] = { order, updatedAt: Date.now() };
}

/* Categorias conhecidas seguem a ordem salva; as demais vão para o fim em
   ordem alfabética. "Sem categoria" continua sempre primeiro. */
function sortCategoriesByAisle(cats, list){
  const order = getAisleOrder(list);
  const rank = {};
  if(order) order.forEach((c,i)=> rank[c] = i);
  return cats.slice().sort((a,b)=>{
    if(a === '') return -1;
    if(b === '') return 1;
    const ra = rank[a] != null ? rank[a] : Infinity;
    const rb = rank[b] != null ? rank[b] : Infinity;
    if(ra !== rb) return ra - rb;
    return a.localeCompare(b, 'pt-BR');
  });
}

function openAisleOrderModal(list){
  const used = Array.from(new Set(list.items.map(i=>i.category).filter(Boolean)));
  const known = Array.from(new Set([...(getAisleOrder(list) || []), ...DEFAULT_CATEGORIES, ...used]));
  let order = sortCategoriesByAisle(known, list).filter(c=>c !== '');
  const local = (list.location && list.location.value) ? list.location.value : null;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Ordem dos corredores</h2>
      <p class="sub">Coloque as categorias na ordem em que você passa por elas ${local ? 'no <strong>' + escapeHtml(local) + '</strong>' : 'no mercado'}. A lista passa a seguir esse trajeto.</p>
      <div id="aisleArea"></div>
      <div class="modal-buttons">
        <button id="aoCancel">Cancelar</button>
        <button class="primary" id="aoSave">Salvar ordem</button>
      </div>
      <button type="button" class="text-danger-link" id="aoReset">Voltar para a ordem alfabética</button>
    </div>`;
  document.body.appendChild(overlay);
  const area = overlay.querySelector('#aisleArea');

  function draw(){
    area.innerHTML = '';
    order.forEach((cat, i)=>{
      const row = document.createElement('div');
      row.className = 'aisle-row';
      row.innerHTML = `
        <span class="ar-pos">${i+1}</span>
        <span class="ar-name">${escapeHtml(cat)}</span>
        <button aria-label="Mover ${escapeHtml(cat)} para cima" ${i===0?'disabled':''}>▲</button>
        <button aria-label="Mover ${escapeHtml(cat)} para baixo" ${i===order.length-1?'disabled':''}>▼</button>`;
      const [up, down] = row.querySelectorAll('button');
      up.onclick = ()=>{ order.splice(i-1, 0, order.splice(i,1)[0]); draw(); };
      down.onclick = ()=>{ order.splice(i+1, 0, order.splice(i,1)[0]); draw(); };
      area.appendChild(row);
    });
  }
  draw();

  overlay.querySelector('#aoCancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#aoSave').onclick = ()=>{
    setAisleOrder(list, order);
    saveData();
    overlay.remove();
    render();
    showToast('Ordem salva' + (local ? ' para ' + local : ''));
    trackEvent('aisle_order_saved');
  };
  overlay.querySelector('#aoReset').onclick = ()=>{
    if(state.aisleOrders) delete state.aisleOrders[aisleKeyFor(list)];
    saveData();
    overlay.remove();
    render();
    showToast('Ordem alfabética restaurada');
  };
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
}

/* ---------- C1/C2: modo compra ---------- */
const shopMode = { active:false, listId:null, wakeLock:null };

async function enterShopMode(list){
  shopMode.active = true;
  shopMode.listId = list.id;
  if(scope.type === 'household') startPresence();   // republica com shopping:true
  trackEvent('shop_mode_start', { itens: list.items.length });
  render();
  window.scrollTo(0,0);
  await acquireWakeLock();
}
async function exitShopMode(){
  shopMode.active = false;
  shopMode.listId = null;
  if(scope.type === 'household') startPresence();
  await releaseWakeLock();
  render();
}
/* C2: impedir que a tela apague no meio do corredor. */
async function acquireWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    shopMode.wakeLock = await navigator.wakeLock.request('screen');
    shopMode.wakeLock.addEventListener('release', ()=>{ shopMode.wakeLock = null; });
  }catch(e){ /* bateria baixa ou aba em segundo plano: segue sem travar a tela */ }
}
async function releaseWakeLock(){
  if(shopMode.wakeLock){
    try{ await shopMode.wakeLock.release(); }catch(e){}
    shopMode.wakeLock = null;
  }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && shopMode.active && !shopMode.wakeLock) acquireWakeLock();
});

function renderShopMode(){
  const list = state.lists.find(l=>l.id === shopMode.listId);
  if(!list){ shopMode.active = false; render(); return; }
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  const bar = document.createElement('div');
  bar.className = 'shop-bar';
  const junto = presenceOnline.filter(p=> p.shopping && p.uid !== myUid());
  bar.innerHTML = `
    <button id="smExit" aria-label="Sair do modo compra">← Sair</button>
    <h2>${escapeHtml(list.name)}${junto.length ? ' · com ' + escapeHtml(junto.map(p=>p.name).join(', ')) : ''}</h2>
    <button id="smHide" aria-pressed="${uiPrefs.hideBought ? 'true':'false'}">${uiPrefs.hideBought ? 'Mostrar todos' : 'Ocultar pegos'}</button>`;
  main.appendChild(bar);

  const pending = list.items.filter(i=>!i.bought);
  const visible = uiPrefs.hideBought ? pending : list.items;
  const grouped = {};
  visible.forEach(it=>{
    if(!grouped[it.category]) grouped[it.category] = [];
    grouped[it.category].push(it);
  });
  Object.keys(grouped).forEach(c=> grouped[c].sort((a,b)=> (a.bought===b.bought)?0:(a.bought?1:-1)));

  const body = document.createElement('div');
  body.style.padding = '4px 14px 8px';
  body.style.maxWidth = '560px';
  body.style.margin = '0 auto';
  if(visible.length === 0){
    body.innerHTML = `<div class="shop-empty">🎉 Tudo pego!<br>Toque em <strong>Finalizar compra</strong> abaixo.</div>`;
  } else {
    sortCategoriesByAisle(Object.keys(grouped), list).forEach(cat=>{
      const block = document.createElement('div');
      block.className = 'category-block';
      block.innerHTML = `<p class="category-title">${escapeHtml(cat === '' ? 'Sem categoria' : cat)}</p>`;
      grouped[cat].forEach((item, idx)=> block.appendChild(renderItemRow(item, list, false, grouped[cat], idx)));
      body.appendChild(block);
    });
  }
  main.appendChild(body);

  const total = list.items.length;
  const bought = total - pending.length;
  const spent = list.items.filter(i=>i.bought).reduce((sum, it)=>{
    const p = parseFloat(it.price); if(isNaN(p)) return sum;
    const q = parseFloat(it.qty);
    return sum + p * (isNaN(q) ? 1 : q);
  }, 0);

  const foot = document.createElement('div');
  foot.className = 'shop-foot';
  foot.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${total ? Math.round(bought/total*100) : 0}%"></div></div>
    <div class="sf-line">
      <span>${bought} de ${total} pegos</span>
      <span class="sf-total">${formatPrice(spent)}</span>
    </div>
    <div class="sf-actions">
      <button id="smAdd">+ item</button>
      <button class="primary" id="smFinish">✓ Finalizar</button>
    </div>`;
  document.body.appendChild(foot);

  bar.querySelector('#smExit').onclick = exitShopMode;
  bar.querySelector('#smHide').onclick = ()=>{
    uiPrefs.hideBought = !uiPrefs.hideBought; saveUiPrefs(); render();
  };
  foot.querySelector('#smAdd').onclick = ()=> openShopAddModal(list);
  foot.querySelector('#smFinish').onclick = async ()=>{
    await exitShopMode();
    openFinishModal(list);
  };
}

/* ---------- C4: desfazer ---------- */
let undoTimer = null;
function showUndoToast(msg, onUndo){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer); clearTimeout(undoTimer);
  t.classList.add('with-action');
  t.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = msg;
  const btn = document.createElement('button');
  btn.className = 'undo-btn';
  btn.textContent = 'Desfazer';
  btn.onclick = ()=>{
    clearTimeout(undoTimer);
    hideToast();
    onUndo();
    showToast('Desfeito');
    trackEvent('undo_used');
  };
  t.appendChild(span); t.appendChild(btn);
  t.classList.add('show');
  announce(msg + '. Toque em desfazer para reverter.');
  undoTimer = setTimeout(hideToast, 6000);
}
function hideToast(){
  const t = document.getElementById('toast');
  t.classList.remove('show');
  setTimeout(()=>{ t.classList.remove('with-action'); }, 220);
}

/* ---------- A6: exportar / importar / restaurar ---------- */
function exportBackup(){
  const payload = {
    app: 'lista-de-compras',
    schemaVersion: SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  a.href = url;
  a.download = `lista-de-compras-backup-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
  showToast('Backup exportado');
  trackEvent('backup_export');
}

function importBackup(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.onchange = ()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      let parsed;
      try{ parsed = JSON.parse(reader.result); }
      catch(e){ showToast('Arquivo inválido'); return; }
      const incoming = normalizeState(parsed && parsed.state ? parsed.state : parsed);
      if(!incoming.lists.length && !incoming.finishedLists.length){
        showToast('O arquivo não tem listas'); return;
      }
      openConfirmModal('Importar backup',
        `O arquivo tem ${incoming.lists.length} lista(s) ativa(s) e ${incoming.finishedLists.length} compra(s) no histórico. Elas serão combinadas com o que já existe aqui — nada é apagado.`,
        'Importar', ()=>{
          state = mergeStates(normalizeState(state), incoming);
          saveData();
          render();
          showToast('Backup importado');
          trackEvent('backup_import');
        });
    };
    reader.readAsText(file);
  };
  input.click();
}

function openRestoreBackupModal(){
  let backups = [];
  try{ backups = JSON.parse(localStorage.getItem(BACKUP_KEY + ':' + scope.type + ':' + (scope.id || 'eu')) || '[]'); }catch(e){}
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const body = backups.length === 0
    ? `<p class="sub">Ainda não há cópias automáticas neste aparelho. Elas são criadas conforme você usa o app.</p>`
    : backups.map((b,i)=>{
        let counts = '';
        try{
          const s = JSON.parse(b.payload);
          const items = (s.lists||[]).reduce((n,l)=> n + (l.items||[]).length, 0);
          counts = `${(s.lists||[]).length} lista(s) · ${items} itens · ${(s.finishedLists||[]).length} no histórico`;
        }catch(e){ counts = 'conteúdo não legível'; }
        return `<div class="carry-item">
          <div class="ci-name">${new Date(b.at).toLocaleString('pt-BR')}<small>${counts}</small></div>
          <button class="carry-toggle keep" data-idx="${i}">Restaurar</button>
        </div>`;
      }).join('');
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Cópias automáticas</h2>
      <p class="sub">As 3 últimas versões salvas neste aparelho. Restaurar combina a cópia com o que existe hoje, sem apagar nada.</p>
      <div>${body}</div>
      <div class="modal-buttons"><button id="rbClose">Fechar</button></div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#rbClose').onclick = ()=> overlay.remove();
  overlay.querySelectorAll('[data-idx]').forEach(btn=>{
    btn.onclick = ()=>{
      const b = backups[parseInt(btn.dataset.idx,10)];
      overlay.remove();
      try{
        const restored = normalizeState(JSON.parse(b.payload));
        state = mergeStates(normalizeState(state), restored);
        saveData(); render();
        showToast('Cópia restaurada');
        trackEvent('backup_restore');
      }catch(e){ showToast('Não foi possível ler essa cópia'); }
    };
  });
  overlay.addEventListener('click', e=>{ if(e.target === overlay) overlay.remove(); });
}

/* ---------- D7: instrumentação anônima (fica no aparelho) ----------
   Seis eventos, sem nome de item e sem identificação: só o suficiente para
   responder "o app é usado do jeito que a gente imaginou?". */
const TRACKED_EVENTS = ['session_start','item_added','item_checked','list_finished','shop_mode_start','undo_used'];
function trackEvent(name, extra){
  try{
    const raw = localStorage.getItem(METRICS_KEY);
    const m = raw ? JSON.parse(raw) : { counts:{}, samples:[], since: Date.now() };
    m.counts[name] = (m.counts[name] || 0) + 1;
    if(extra){
      m.samples.push(Object.assign({ e:name, t:Date.now() }, extra));
      if(m.samples.length > 400) m.samples = m.samples.slice(-400);
    }
    localStorage.setItem(METRICS_KEY, JSON.stringify(m));
  }catch(e){ /* métrica nunca pode quebrar o app */ }
}
function getMetricsSummary(){
  let m;
  try{ m = JSON.parse(localStorage.getItem(METRICS_KEY) || 'null'); }catch(e){}
  if(!m) return null;
  const origins = {};
  m.samples.filter(s=>s.e === 'item_added' && s.origin).forEach(s=>{
    origins[s.origin] = (origins[s.origin] || 0) + (s.qtd || 1);
  });
  const finished = m.samples.filter(s=>s.e === 'list_finished');
  const avgItems = finished.length
    ? Math.round(finished.reduce((n,s)=> n + (s.itens||0), 0) / finished.length * 10) / 10
    : null;
  return {
    desde: new Date(m.since).toLocaleDateString('pt-BR'),
    contagens: m.counts,
    origemDosItens: origins,
    mediaItensPorCompra: avgItems,
    modoAtual: state.appMode
  };
}
window.metricasLista = getMetricsSummary;   // console: metricasLista()

/* ---------- D4: convite de instalação do PWA ---------- */
let deferredInstall = null;
function setupInstallPrompt(){
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstall = e;
    maybeShowInstallBanner();
  });
  window.addEventListener('appinstalled', ()=>{
    try{ localStorage.setItem(INSTALL_KEY, JSON.stringify({ installed:true })); }catch(e){}
    const b = document.getElementById('installBanner'); if(b) b.remove();
  });
  // conta as visitas: o convite só aparece a partir da segunda
  try{
    const raw = localStorage.getItem(INSTALL_KEY);
    const info = raw ? JSON.parse(raw) : { visits:0 };
    info.visits = (info.visits || 0) + 1;
    localStorage.setItem(INSTALL_KEY, JSON.stringify(info));
  }catch(e){}
}
function maybeShowInstallBanner(){
  let info = {};
  try{ info = JSON.parse(localStorage.getItem(INSTALL_KEY) || '{}'); }catch(e){}
  if(info.installed || info.dismissed) return;
  if((info.visits || 0) < 2) return;
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(document.getElementById('installBanner')) return;

  const el = document.createElement('div');
  el.className = 'install-banner';
  el.id = 'installBanner';
  el.innerHTML = `
    <div class="ib-text"><strong>Instalar na tela inicial</strong>Abre mais rápido e funciona offline no mercado.</div>
    <button class="ib-no" id="ibNo">Agora não</button>
    <button class="ib-yes" id="ibYes">Instalar</button>`;
  document.body.appendChild(el);
  el.querySelector('#ibNo').onclick = ()=>{
    info.dismissed = true;
    try{ localStorage.setItem(INSTALL_KEY, JSON.stringify(info)); }catch(e){}
    el.remove();
  };
  el.querySelector('#ibYes').onclick = async ()=>{
    el.remove();
    if(!deferredInstall) return;
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
  };
}

/* ===================================================================
   FASE 4 · BLOCO G — COLABORAÇÃO FAMILIAR
   ===================================================================

   O caso de uso que motiva tudo aqui: duas pessoas no mesmo mercado, ou
   uma no corredor e outra em casa lembrando do que falta. Sem isso, a
   sincronização da Fase 3 resolve "meus aparelhos" mas não resolve
   "minha família".

   MODELO DE DADOS
   ---------------
   households/{hid}
     { name, ownerUid, createdAt, updatedAt,
       memberUids: [uid,...],        // para consultar "de quais famílias faço parte"
       members: { uid: {role, name, joinedAt} },
       state: { ...mesmo formato do estado pessoal... } }

   householdInvites/{code}
     { householdId, role, createdBy, createdAt, expiresAt }

   households/{hid}/presence/{uid}
     { name, lastSeen, shopping }

   O `state` compartilhado usa exatamente o mesmo formato do pessoal, então
   mergeStates(), o modo compra, o parser e tudo o mais funcionam sem
   alteração. O documento único por família herda a mesma limitação do
   documento único por usuário — a granularidade real vem no bloco F.

   PAPÉIS
   ------
   owner  — tudo, inclusive convidar, mudar papéis e excluir a família
   editor — mexer nas listas
   viewer — só ler (útil para quem só quer acompanhar o que falta)
*/

let convitePendente = null;

/* Convite recebido por link: se a pessoa ainda não estava logada, o código
   fica guardado e é consumido assim que a sessão existir. */
async function tratarConviteDaUrl(){
  if(!convitePendente || !authUser) return;
  const code = convitePendente;
  convitePendente = null;
  openJoinHouseholdModal(code);
}

const HOUSEHOLD_COLLECTION = 'households';
const INVITE_COLLECTION = 'householdInvites';
const PRESENCE_TTL = 90 * 1000;          // após 90s sem sinal, a pessoa sai do "online"
const PRESENCE_HEARTBEAT = 30 * 1000;

let scope = { type: 'personal', id: null, name: 'Minhas listas' };
let myHouseholds = [];                   // [{id, name, role, memberCount}]
let currentHousehold = null;             // documento completo quando scope.type==='household'
let unsubHouseholds = null;
let unsubPresence = null;
let presenceTimer = null;
let presenceOnline = [];                 // [{uid, name, lastSeen, shopping}]

/* ---------- identidade e papéis ---------- */
function myUid(){ return authUser && authUser.uid; }
function myDisplayName(){
  if(!authUser) return 'Você';
  return authUser.displayName || (authUser.email ? authUser.email.split('@')[0] : 'Você');
}
function myRole(){
  if(scope.type !== 'household') return 'owner';
  if(!currentHousehold || !currentHousehold.members) return 'viewer';
  const m = currentHousehold.members[myUid()];
  return m ? m.role : 'viewer';
}
function canEdit(){ return myRole() !== 'viewer'; }
function isOwner(){ return myRole() === 'owner'; }

function memberName(uid){
  if(!uid) return '';
  if(uid === myUid()) return 'você';
  if(currentHousehold && currentHousehold.members && currentHousehold.members[uid]){
    return currentHousehold.members[uid].name || 'membro';
  }
  return 'alguém';
}
function initialsOf(name){
  const parts = String(name || '?').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
/* Cor derivada do uid: estável entre aparelhos, sem precisar guardar nada. */
function colorFor(uid){
  const palette = ['#3F6B4A','#B5651D','#5B6E8C','#8C5B6E','#6E8C5B','#8C7A5B','#5B8C86','#7A5B8C'];
  let h = 0;
  String(uid || '').split('').forEach(c=>{ h = (h * 31 + c.charCodeAt(0)) >>> 0; });
  return palette[h % palette.length];
}
function avatarHtml(uid, name, extraClass){
  const online = presenceOnline.some(p=> p.uid === uid);
  return `<span class="avatar ${extraClass || ''} ${online ? 'online' : ''}"
    style="background:${colorFor(uid)}" title="${escapeHtml(name || '')}">${escapeHtml(initialsOf(name))}</span>`;
}

/* ---------- alternância de escopo ---------- */
function applyScopeToHeader(){

}

function renderPresenceStack(){
  const stack = document.getElementById('presenceStack');
  if(!stack) return;
  if(scope.type !== 'household' || presenceOnline.length <= 1){ stack.innerHTML = ''; return; }
  stack.innerHTML = presenceOnline
    .filter(p=> p.uid !== myUid())

async function switchScope(newScope){
  stopPresence();
  scope = newScope;
  const p = loadPrefs();
  p.scope = { type: newScope.type, id: newScope.id, name: newScope.name };
  savePrefs(p);

  // com o da família nem vazar de um para o outro ao trocar
  state = normalizeState(await loadData());
  currentHousehold = null;
  render();
  applyScopeToHeader();
  startRealtimeSync();

/* Cada escopo grava numa chave própria do localStorage. */
function storageKeyForScope(){

}

/* ---------- lista de famílias do usuário ---------- */
function watchMyHouseholds(){
  if(unsubHouseholds){ unsubHouseholds(); unsubHouseholds = null; }
  if(!db || !authUser) return;
  unsubHouseholds = db.collection(HOUSEHOLD_COLLECTION)
    .where('memberUids', 'array-contains', myUid())
    .onSnapshot(snap=>{
      myHouseholds = snap.docs.map(d=>{
        const data = d.data();
        const me = (data.members || {})[myUid()] || {};
        return {
          id: d.id, name: data.name || 'Família',
          role: me.role || 'viewer',
          memberCount: (data.memberUids || []).length
        };
      });
      // se a pessoa foi removida da família que está aberta, volta para o pessoal
      if(scope.type === 'household' && !myHouseholds.find(h=> h.id === scope.id)){
        showToast('Você não faz mais parte dessa família');
        switchScope({ type:'personal', id:null, name:'Minhas listas' });
      }

    }, err=> console.warn('Erro ao observar famílias', err));

/* ---------- criar família ---------- */
async function createHousehold(name){
  if(!db || !authUser) return null;
  const uid = myUid();
  const ref = db.collection(HOUSEHOLD_COLLECTION).doc();
  const payload = {
    name: name,
    ownerUid: uid,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    memberUids: [uid],
    members: { [uid]: { role:'owner', name: myDisplayName(), joinedAt: Date.now() } },
    state: normalizeState(null)
  };
  await ref.set(payload);
  trackEvent('household_created');
  return { id: ref.id, name };
}

/* ---------- convites ---------- */
function generateInviteCode(){
  // sem 0/O/1/I para não confundir quem digita à mão
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  const arr = new Uint32Array(8);
  (window.crypto || window.msCrypto).getRandomValues(arr);
  for(let i=0;i<8;i++) out += alphabet[arr[i] % alphabet.length];
  return out;
}

async function createInvite(householdId, role, dias){
  const code = generateInviteCode();
  await db.collection(INVITE_COLLECTION).doc(code).set({
    householdId, role: role || 'editor',
    createdBy: myUid(), createdAt: Date.now(),
    expiresAt: Date.now() + (dias || 7) * 86400000
  });
  trackEvent('invite_created');
  return code;
}

function inviteLink(code){
  return location.origin + location.pathname + '?convite=' + code;
}

/* Entrar numa família a partir de um código. O cliente lê o convite, e as
   regras de segurança conferem por conta própria: o servidor só aceita a
   auto-inclusão se o convite existir, não tiver expirado e o papel bater. */
async function joinHousehold(code){
  if(!db || !authUser) return { ok:false, erro:'Você precisa estar logado.' };
  const clean = String(code || '').trim().toUpperCase();
  if(!clean) return { ok:false, erro:'Código vazio.' };
  try{
    const invSnap = await db.collection(INVITE_COLLECTION).doc(clean).get();
    if(!invSnap.exists) return { ok:false, erro:'Convite não encontrado. Confira o código.' };
    const inv = invSnap.data();
    if((inv.expiresAt || 0) < Date.now()) return { ok:false, erro:'Este convite expirou. Peça um novo.' };

    const hRef = db.collection(HOUSEHOLD_COLLECTION).doc(inv.householdId);
    const uid = myUid();
    await hRef.update({
      memberUids: firebase.firestore.FieldValue.arrayUnion(uid),
      ['members.' + uid]: {
        role: inv.role, name: myDisplayName(), joinedAt: Date.now(), inviteCode: clean
      },
      updatedAt: Date.now()
    });
    const hSnap = await hRef.get();
    trackEvent('household_joined');
    return { ok:true, id: inv.householdId, name: (hSnap.data() || {}).name || 'Família' };
  }catch(e){
    console.error('Erro ao entrar na família', e);
    if(e.code === 'permission-denied') return { ok:false, erro:'O convite não é mais válido.' };
    return { ok:false, erro:'Não foi possível entrar agora. Tente de novo.' };
  }
}

/* ---------- presença ---------- */
function startPresence(){
  stopPresence();
  if(!db || !authUser || scope.type !== 'household') return;
  const col = db.collection(HOUSEHOLD_COLLECTION).doc(scope.id).collection('presence');

  const beat = async ()=>{
    if(document.hidden) return;
    try{
      await col.doc(myUid()).set({
        name: myDisplayName(), lastSeen: Date.now(), shopping: !!shopMode.active
      });
    }catch(e){ /* presença é enfeite: nunca pode atrapalhar o uso */ }
  };
  beat();
  presenceTimer = setInterval(beat, PRESENCE_HEARTBEAT);

  unsubPresence = col.onSnapshot(snap=>{
    const agora = Date.now();
    presenceOnline = snap.docs
      .map(d=> Object.assign({ uid: d.id }, d.data()))
      .filter(p=> (agora - (p.lastSeen || 0)) < PRESENCE_TTL);
    renderPresenceStack();
    const comprando = presenceOnline.filter(p=> p.shopping && p.uid !== myUid());
    const bar = document.getElementById('presenceNote');
    if(bar){
      bar.textContent = comprando.length
        ? `${comprando.map(p=>p.name).join(' e ')} ${comprando.length>1?'estão':'está'} no mercado agora`
        : '';
    }
  }, err=> console.warn('Erro na presença', err));
}

function stopPresence(){
  if(presenceTimer){ clearInterval(presenceTimer); presenceTimer = null; }
  if(unsubPresence){ unsubPresence(); unsubPresence = null; }
  presenceOnline = [];
  renderPresenceStack();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && scope.type === 'household' && authUser) startPresence();
});

/* ---------- notificação de alteração remota ----------
   Push de verdade (FCM) exige uma Cloud Function para enviar — não dá para
   fazer só no cliente. O que dá para fazer sem servidor, e que já cobre o
   caso real ("alguém acrescentou item enquanto eu estava no mercado"), é
   notificar quando o app está aberto em segundo plano. O push completo fica
   registrado como pendência do bloco J. */
function notifyRemoteChange(resumo){
  if(document.visibilityState === 'visible'){ showToast(resumo); return; }
  if(!('Notification' in window) || Notification.permission !== 'granted'){ return; }
  try{
    new Notification('Lista de Compras', { body: resumo, tag: 'lista-mudou', icon: './icon-192.png' });
  }catch(e){ /* alguns navegadores exigem o service worker; silencioso de propósito */ }
}

async function pedirPermissaoNotificacao(){
  if(!('Notification' in window)) return false;
  if(Notification.permission === 'granted') return true;
  if(Notification.permission === 'denied') return false;
  const r = await Notification.requestPermission();
  return r === 'granted';
}

/* Compara dois estados e descreve a diferença em uma frase. */
function descreverMudanca(antes, depois){
  const conta = (s)=> (s.lists || []).reduce((n,l)=> n + (l.items||[]).length, 0);
  const nAntes = conta(antes), nDepois = conta(depois);
  if(nDepois > nAntes){
    const idsAntes = new Set();
    (antes.lists||[]).forEach(l=> (l.items||[]).forEach(i=> idsAntes.add(i.id)));
    const novos = [];
    (depois.lists||[]).forEach(l=> (l.items||[]).forEach(i=>{ if(!idsAntes.has(i.id)) novos.push(i); }));
    if(novos.length === 1){
      const quem = memberName(novos[0].addedBy);
      return `${quem === 'você' ? 'Alguém' : quem} adicionou "${novos[0].name}"`;
    }
    if(novos.length > 1) return `${novos.length} itens adicionados`;
  }
  if(nDepois < nAntes) return 'Itens removidos da lista';
  // marcações
  const boughtAntes = {}, boughtDepois = {};
  (antes.lists||[]).forEach(l=> (l.items||[]).forEach(i=> boughtAntes[i.id] = i.bought));
  let marcado = null;
  (depois.lists||[]).forEach(l=> (l.items||[]).forEach(i=>{
    if(i.bought && !boughtAntes[i.id]) marcado = i;
  }));
  if(marcado){
    const quem = memberName(marcado.boughtBy);
    return `${quem === 'você' ? 'Alguém' : quem} pegou "${marcado.name}"`;
  }
  return 'Lista atualizada';
}

      btn.disabled = false; btn.textContent = 'Criar';

    }
  };
  focusIfNotTouch(overlay.querySelector('#chName'));
}

function openJoinHouseholdModal(codigoPrevio){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Entrar numa família</h2>
      <p class="sub">Cole o código de 8 letras que te enviaram, ou abra o link do convite direto no navegador.</p>
      <div class="field">
        <label for="jhCode">Código do convite</label>
        <input type="text" id="jhCode" placeholder="ABCD2345" maxlength="8"
          style="text-transform:uppercase; letter-spacing:3px; font-family:'Space Mono',monospace;"
          value="${escapeHtml(codigoPrevio || '')}">
      </div>
      <p class="auth-err" id="jhErr" style="display:none;" role="alert"></p>
      <div class="modal-buttons">
        <button id="jhCancel">Cancelar</button>
        <button class="primary" id="jhGo">Entrar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = wireModalDismiss(overlay);
  const err = overlay.querySelector('#jhErr');
  overlay.querySelector('#jhCancel').onclick = close;
  overlay.querySelector('#jhGo').onclick = async ()=>{
    const btn = overlay.querySelector('#jhGo');
    btn.disabled = true; btn.textContent = 'Entrando...';
    err.style.display = 'none';
    const r = await joinHousehold(overlay.querySelector('#jhCode').value);
    if(r.ok){
      close();
      await switchScope({ type:'household', id:r.id, name:r.name });
      showToast('Você entrou em ' + r.name);
    } else {
      err.textContent = r.erro;
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
  focusIfNotTouch(overlay.querySelector('#jhCode'));
}

function openManageHouseholdModal(){
  if(scope.type !== 'household' || !currentHousehold){
    showToast('Abra uma família primeiro');
    return;
  }
  const membros = Object.keys(currentHousehold.members || {}).map(uid=>
    Object.assign({ uid }, currentHousehold.members[uid])
  ).sort((a,b)=> (a.joinedAt||0) - (b.joinedAt||0));
  const souDono = isOwner();

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h2>${escapeHtml(currentHousehold.name || 'Família')}</h2>
      <p class="sub">${membros.length} ${membros.length===1?'pessoa':'pessoas'}. ${souDono
        ? 'Como responsável, você convida, muda permissões e remove pessoas.'
        : 'Só o responsável pode convidar e mudar permissões.'}</p>

      <div id="inviteArea"></div>

      ${souDono ? `
        <div class="map-options">
          <button class="map-option-btn" id="mhInvite">
            <span class="moi">✉️</span>
            <span class="mot"><strong>Convidar alguém</strong><span>Gera um código e um link válidos por 7 dias</span></span>
          </button>
        </div>` : ''}

      <label style="display:block; font-size:12px; font-weight:600; color:var(--ink-light); margin:16px 0 2px; text-transform:uppercase; letter-spacing:0.4px;">Membros</label>
      <div id="membrosArea">
        ${membros.map(m=>`
          <div class="member-row" data-uid="${m.uid}">
            ${avatarHtml(m.uid, m.name)}
            <span class="mr-info">
              <span class="mr-name">${escapeHtml(m.name || 'membro')}${m.uid===myUid()?' (você)':''}</span>
              <span class="mr-sub">${presenceOnline.some(p=>p.uid===m.uid) ? 'online agora' : 'entrou em ' + new Date(m.joinedAt||Date.now()).toLocaleDateString('pt-BR')}</span>
            </span>
            ${(souDono && m.uid !== myUid()) ? `
              <select class="mr-role" aria-label="Permissão de ${escapeHtml(m.name||'membro')}">
                <option value="editor" ${m.role==='editor'?'selected':''}>editor</option>
                <option value="viewer" ${m.role==='viewer'?'selected':''}>só leitura</option>
                <option value="owner"  ${m.role==='owner'?'selected':''}>responsável</option>
              </select>
              <button class="mr-remove" aria-label="Remover ${escapeHtml(m.name||'membro')}">&times;</button>
            ` : `<span class="role-badge ${m.role}">${papelPorExtenso(m.role)}</span>`}
          </div>`).join('')}
      </div>

      <div class="modal-buttons">
        <button id="mhClose">Fechar</button>
        <button class="danger" id="mhLeave">${souDono && membros.length===1 ? 'Excluir família' : 'Sair da família'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = wireModalDismiss(overlay);
  overlay.querySelector('#mhClose').onclick = close;

  const inviteBtn = overlay.querySelector('#mhInvite');
  if(inviteBtn) inviteBtn.onclick = async ()=>{
    inviteBtn.disabled = true;
    try{
      const code = await createInvite(scope.id, 'editor', 7);
      mostrarConvite(overlay.querySelector('#inviteArea'), code);
    }catch(e){
      console.error(e);
      showToast('Não foi possível gerar o convite');
    }
    inviteBtn.disabled = false;
  };

  overlay.querySelectorAll('.mr-role').forEach(sel=>{
    sel.onchange = async ()=>{
      const uid = sel.closest('.member-row').dataset.uid;
      try{
        await db.collection(HOUSEHOLD_COLLECTION).doc(scope.id)
          .update({ ['members.' + uid + '.role']: sel.value, updatedAt: Date.now() });
        showToast('Permissão atualizada');
      }catch(e){ showToast('Não foi possível alterar'); }
    };
  });

  overlay.querySelectorAll('.mr-remove').forEach(btn=>{
    btn.onclick = ()=>{
      const row = btn.closest('.member-row');
      const uid = row.dataset.uid;
      const nome = row.querySelector('.mr-name').textContent;
      openConfirmModal('Remover da família',
        `${nome} deixa de ver e editar as listas desta família. As listas pessoais dessa pessoa não são afetadas.`,
        'Remover', async ()=>{
          try{
            await db.collection(HOUSEHOLD_COLLECTION).doc(scope.id).update({
              memberUids: firebase.firestore.FieldValue.arrayRemove(uid),
              ['members.' + uid]: firebase.firestore.FieldValue.delete(),
              updatedAt: Date.now()
            });
            close();
            showToast('Removido');
          }catch(e){ showToast('Não foi possível remover'); }
        }, true);
    };
  });

  overlay.querySelector('#mhLeave').onclick = ()=>{
    const sozinho = souDono && membros.length === 1;
    openConfirmModal(sozinho ? 'Excluir família' : 'Sair da família',
      sozinho
        ? 'As listas compartilhadas desta família serão apagadas para sempre. Suas listas pessoais não são afetadas.'
        : 'Você deixa de ver as listas desta família. Elas continuam existindo para os outros membros.',
      sozinho ? 'Excluir' : 'Sair', async ()=>{
        try{
          if(sozinho){
            await db.collection(HOUSEHOLD_COLLECTION).doc(scope.id).delete();
          } else {
            await db.collection(HOUSEHOLD_COLLECTION).doc(scope.id).update({
              memberUids: firebase.firestore.FieldValue.arrayRemove(myUid()),
              ['members.' + myUid()]: firebase.firestore.FieldValue.delete(),
              updatedAt: Date.now()
            });
          }
          close();
          await switchScope({ type:'personal', id:null, name:'Minhas listas' });
          showToast(sozinho ? 'Família excluída' : 'Você saiu da família');
        }catch(e){
          console.error(e);
          showToast('Não foi possível concluir');
        }
      }, true);
  };
}

function mostrarConvite(area, code){
  const link = inviteLink(code);
  area.innerHTML = `
    <div class="invite-box">
      <div class="ib-note">Código do convite</div>
      <div class="ib-code">${escapeHtml(code)}</div>
      <div class="ib-note">Vale por 7 dias. Quem usar entra como <strong>editor</strong>.</div>
      <div class="invite-actions">
        <button id="ivCopy">Copiar link</button>
        <button id="ivShare">Compartilhar</button>
      </div>
    </div>`;
  area.querySelector('#ivCopy').onclick = async ()=>{
    try{ await navigator.clipboard.writeText(link); showToast('Link copiado'); }
    catch(e){ showToast(link); }
  };
  area.querySelector('#ivShare').onclick = async ()=>{
    const texto = `Entre na nossa lista de compras: ${link}`;
    if(navigator.share){
      try{ await navigator.share({ title:'Lista de Compras', text: texto, url: link }); }catch(e){}
    } else {
      try{ await navigator.clipboard.writeText(texto); showToast('Convite copiado'); }
      catch(e){ showToast(link); }
    }
  };
}

function openAssignModal(item, list){
  if(scope.type !== 'household' || !currentHousehold) return;
  const membros = Object.keys(currentHousehold.members || {}).map(uid=>
    Object.assign({ uid }, currentHousehold.members[uid]));
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true">
      <h2>Quem pega isso?</h2>
      <p class="sub">"${escapeHtml(item.name)}" — útil quando vocês se dividem pelo mercado.</p>
      <div id="asArea">
        <div class="member-row" data-uid="">
          <span class="avatar" style="background:var(--ink-light)">—</span>
          <span class="mr-info"><span class="mr-name">Ninguém em especial</span>
          <span class="mr-sub">qualquer um pega</span></span>
          ${!item.assignedTo ? '<span class="hr-check">✓</span>' : ''}
        </div>

      showToast(item.assignedTo ? 'Atribuído a ' + memberName(item.assignedTo) : 'Atribuição removida');

    };
  });

/* ---------- Comportamento comum de modais ----------
   Dois problemas reais que apareceram em uso:
   (a) dar foco no campo abre o teclado virtual, que come a metade de baixo
       da tela — inclusive os botões de ação. Em telas de toque o foco fica
       por conta do usuário;
   (b) alguns modais não fechavam por toque fora nem por Esc, então quando
       o botão ficava inacessível não havia saída nenhuma. */
function focusIfNotTouch(el){
  if(!el) return;
  const touch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  if(!touch) el.focus();
}

function wireModalDismiss(overlay, onClose){
  const close = ()=>{
    document.removeEventListener('keydown', onKey);
    overlay.remove();
    if(onClose) onClose();
  };
  function onKey(e){ if(e.key === 'Escape'){ e.preventDefault(); close(); } }
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', e=>{ if(e.target === overlay) close(); });
  overlay.__close = close;
  return close;
}

/* =================== UTIL =================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatPrice(v){
  const n = typeof v === 'number' ? v : parseFloat(v);
  if(isNaN(n)) return 'R$ 0,00';
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  clearTimeout(toastTimer);
  clearTimeout(undoTimer);
  t.classList.remove('with-action');
  t.textContent = msg;
  t.classList.add('show');
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}
