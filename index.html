<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Lista de Compras</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#3F6B4A">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper:#F4EFE3;
    --card:#FFFDF8;
    --ink:#2B2B26;
    /* D2: era #84796A (contraste 4.0:1 sobre o papel — abaixo do AA).
       #6E6355 sobe para ~5.4:1 mantendo o tom de tinta desbotada. */
    --ink-light:#6E6355;
    --green:#3F6B4A;
    --green-light:#E6EEE3;
    --amber:#C97A3D;
    --amber-light:#F7E9DA;
    --red:#B5482F;
    --border:#DCD2BD;
    --shadow:rgba(43,38,26,0.14);
    --radius:2px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(43,38,26,0.05) 1px, transparent 0) 0 0/14px 14px,
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:96px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- Tema escuro (versão completa) ---------- */
  body.theme-dark{
    --paper:#1c1b18;
    --card:#252420;
    --ink:#EDE7DA;
    --ink-light:#A79C89;
    --green:#5FA875;
    --green-light:#28352C;
    --amber:#D98F52;
    --amber-light:#3A2E22;
    --red:#E08064;
    --border:#3A362D;
    --shadow:rgba(0,0,0,0.5);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.045) 1px, transparent 0) 0 0/14px 14px,
      var(--paper);
  }
  body.theme-dark input[type=text], body.theme-dark input[type=number],
  body.theme-dark select, body.theme-dark .search-row input, body.theme-dark .add-item-form input,
  body.theme-dark .add-item-form select{
    background:var(--card); color:var(--ink); border-color:var(--border);
  }

  /* ---------- Acessibilidade ---------- */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{
    outline:2px solid var(--green); outline-offset:2px;
  }

  /* ---------- Header ---------- */
  header.app-header{
    position:sticky; top:0; z-index:30;
    background:var(--paper);
    border-bottom:1px solid var(--border);
    padding:14px 16px 10px;
  }
  .brand{
    display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  }
  .brand h1{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:19px;
    letter-spacing:0.5px;
    margin:0;
    display:flex; align-items:center; gap:8px;
  }
  .brand h1 .dot{color:var(--green); font-size:22px; line-height:0;}
  .icon-btn{
    background:none; border:1px solid var(--border); border-radius:999px;
    width:36px; height:36px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink); flex-shrink:0;
  }
  .icon-btn:active{background:var(--green-light); border-color:var(--green);}

  .mode-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;
  }
  .mode-switch{
    display:flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; background:var(--card);
  }
  .mode-switch button{
    font-family:'Space Mono',monospace; font-size:11px; padding:7px 13px; border:none;
    background:transparent; color:var(--ink-light); cursor:pointer;
  }
  .mode-switch button.active{background:var(--ink); color:var(--card);}

  .tabs-row{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:4px;
    scrollbar-width:none;
  }
  .tabs-row::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:'Space Mono', monospace;
    font-size:12px;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    background:var(--card);
    color:var(--ink-light);
    white-space:nowrap;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .tab.active{
    background:var(--ink); color:var(--card); border-color:var(--ink);
  }
  .tab .rec-mark{font-size:11px;}
  .tab .overdue-dot{font-size:9px; color:var(--red);}
  .tab.add-tab{
    color:var(--green); border-color:var(--green); border-style:dashed;
    background:transparent;
  }

  main{max-width:560px; margin:0 auto; padding:18px 14px 0;}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-light);
  }
  .empty-state .big{font-size:40px; margin-bottom:10px;}
  .empty-state h2{font-family:'Space Mono',monospace; font-size:16px; color:var(--ink); margin:0 0 6px;}
  .empty-state p{font-size:14px; line-height:1.5; margin:0 0 18px;}

  /* ---------- Receipt card ---------- */
  .receipt{
    background:var(--card);
    box-shadow:0 10px 24px -8px var(--shadow);
    transform:rotate(-0.25deg);
    position:relative;
    padding:22px 18px 4px;
    clip-path: polygon(
      0% 8px, 2% 0%, 4% 8px, 6% 0%, 8% 8px, 10% 0%, 12% 8px, 14% 0%, 16% 8px, 18% 0%, 20% 8px, 22% 0%, 24% 8px, 26% 0%, 28% 8px, 30% 0%, 32% 8px, 34% 0%, 36% 8px, 38% 0%, 40% 8px, 42% 0%, 44% 8px, 46% 0%, 48% 8px, 50% 0%, 52% 8px, 54% 0%, 56% 8px, 58% 0%, 60% 8px, 62% 0%, 64% 8px, 66% 0%, 68% 8px, 70% 0%, 72% 8px, 74% 0%, 76% 8px, 78% 0%, 80% 8px, 82% 0%, 84% 8px, 86% 0%, 88% 8px, 90% 0%, 92% 8px, 94% 0%, 96% 8px, 98% 0%, 100% 8px,
      100% 100%,
      98% calc(100% - 8px), 96% 100%, 94% calc(100% - 8px), 92% 100%, 90% calc(100% - 8px), 88% 100%, 86% calc(100% - 8px), 84% 100%, 82% calc(100% - 8px), 80% 100%, 78% calc(100% - 8px), 76% 100%, 74% calc(100% - 8px), 72% 100%, 70% calc(100% - 8px), 68% 100%, 66% calc(100% - 8px), 64% 100%, 62% calc(100% - 8px), 60% 100%, 58% calc(100% - 8px), 56% 100%, 54% calc(100% - 8px), 52% 100%, 50% calc(100% - 8px), 48% 100%, 46% calc(100% - 8px), 44% 100%, 42% calc(100% - 8px), 40% 100%, 38% calc(100% - 8px), 36% 100%, 34% calc(100% - 8px), 32% 100%, 30% calc(100% - 8px), 28% 100%, 26% calc(100% - 8px), 24% 100%, 22% calc(100% - 8px), 20% 100%, 18% calc(100% - 8px), 16% 100%, 14% calc(100% - 8px), 12% 100%, 10% calc(100% - 8px), 8% 100%, 6% calc(100% - 8px), 4% 100%, 2% calc(100% - 8px), 0% 100%
    );
    margin-bottom:18px;
  }
  .receipt-head{
    text-align:center; padding-bottom:14px; border-bottom:1px dashed var(--border);
    margin-bottom:6px;
  }
  .receipt-head .list-name{
    font-family:'Space Mono',monospace; font-weight:700; font-size:18px;
    text-transform:uppercase; letter-spacing:1px; margin:0 0 4px;
    word-break:break-word;
  }
  .receipt-head .list-meta{
    font-size:11px; color:var(--ink-light); display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
  }
  .receipt-head .list-meta .rec-badge{color:var(--green); font-weight:600;}
  .receipt-head .list-meta .overdue-badge{color:var(--red); font-weight:700;}

  .progress-row{
    display:flex; align-items:center; gap:10px; padding:12px 0 10px; border-bottom:1px dashed var(--border);
  }
  .progress-track{
    flex:1; height:6px; background:var(--border); border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:var(--green); border-radius:99px; transition:width .25s ease;
  }
  .progress-label{
    font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-light); white-space:nowrap;
  }

  .total-row{
    font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-light);
    padding:8px 0; border-bottom:1px dashed var(--border); text-align:right;
  }
  .total-row strong{color:var(--ink);}

  .search-row{padding:10px 0 2px;}
  .search-row input{
    width:100%; font-family:'Inter',sans-serif; font-size:14px; padding:9px 10px;
    border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--ink);
  }

  .category-block{padding-top:12px;}
  .category-title{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--ink-light); margin:0 0 6px;
    display:flex; align-items:center; gap:8px;
  }
  .category-title::after{
    content:''; flex:1; border-bottom:1px dotted var(--border); transform:translateY(-3px);
  }

  .item-row{
    display:flex; align-items:flex-start; gap:8px;
    padding:8px 0;
    border-bottom:1px dotted var(--border);
  }
  .item-row:last-child{border-bottom:none;}
  .check{
    width:22px; height:22px; flex-shrink:0; border:1.5px solid var(--ink-light);
    border-radius:5px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin-top:1px; background:var(--card);
  }
  .check svg{width:14px; height:14px; opacity:0; transition:opacity .12s;}
  .item-row.bought .check{background:var(--green); border-color:var(--green);}
  .item-row.bought .check svg{opacity:1; stroke:#fff;}
  .item-main{flex:1; min-width:0;}
  .item-name-row{display:flex; gap:6px; align-items:baseline; flex-wrap:wrap;}
  .item-name{font-size:14.5px; font-weight:500; word-break:break-word;}
  .item-row.bought .item-name{text-decoration:line-through; color:var(--ink-light); font-weight:400;}
  .item-price{font-family:'Space Mono',monospace; font-size:11px; color:var(--green); margin-top:2px;}
  .item-qty{
    font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-light); flex-shrink:0;
    white-space:nowrap; margin-top:2px;
  }
  .drag-handle{
    cursor:grab; touch-action:none; color:var(--ink-light); font-size:17px;
    padding:2px 6px; flex-shrink:0; user-select:none; -webkit-user-select:none;
    display:flex; align-items:center; line-height:1;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-row.dragging{
    opacity:0.45; background:var(--green-light); border-radius:6px;
  }
  body.dragging-active, body.dragging-active *{
    user-select:none !important; -webkit-user-select:none !important;
  }
  .item-edit{
    background:none; border:none; color:var(--ink-light); cursor:pointer; padding:4px;
    flex-shrink:0; font-size:14px; line-height:1; margin-top:1px;
  }
  .item-del{
    background:none; border:none; color:var(--ink-light); cursor:pointer; padding:4px;
    flex-shrink:0; font-size:16px; line-height:1; margin-top:1px;
  }
  .item-del:active{color:var(--red);}

  .add-item-form{
    display:flex; flex-wrap:wrap; gap:8px; padding:14px 0 16px; border-top:1px dashed var(--border); margin-top:8px;
  }
  .add-item-form input, .add-item-form select{
    font-family:'Inter',sans-serif; font-size:14px; padding:9px 10px;
    border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--ink);
  }
  .add-item-form .f-name{flex:1 1 140px; min-width:120px;}
  .add-item-form .f-qty{width:64px;}
  .add-item-form .f-unit{width:78px;}
  .add-item-form .f-cat{flex:1 1 110px; min-width:100px;}
  .add-item-form .f-price{width:84px;}
  .add-item-form button{
    font-family:'Space Mono',monospace; font-weight:700; font-size:13px;
    background:var(--green); color:#fff; border:none; border-radius:6px;
    padding:9px 14px; cursor:pointer; flex-shrink:0;
  }
  .add-item-form button:active{background:#335a3e;}

  .list-actions{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px;
  }
  .list-actions button{
    flex:1 1 auto;
    font-family:'Space Mono',monospace; font-size:12.5px; font-weight:700;
    padding:11px 10px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border); background:var(--card); color:var(--ink);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .list-actions button.primary{background:var(--ink); color:var(--card); border-color:var(--ink);}
  .list-actions button:active{transform:translateY(1px);}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:18px; z-index:40;
    width:54px; height:54px; border-radius:50%;
    background:var(--green); color:#fff; border:none;
    box-shadow:0 8px 18px -4px rgba(63,107,74,0.55);
    font-size:26px; display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .fab:active{transform:scale(0.94);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,38,26,0.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width:560px){ .modal-overlay{align-items:center;} }
  .modal{
    background:var(--paper); width:100%; max-width:480px;
    border-radius:16px 16px 0 0; padding:20px 18px 0; overflow-y:auto;
    box-shadow:0 -10px 30px rgba(0,0,0,0.2);
    /* dvh acompanha a altura REAL da janela quando o teclado virtual abre.
       Com vh, o modal continuava dimensionado para a tela inteira e os
       botões do rodapé ficavam embaixo do teclado — visualmente presentes,
       mas impossíveis de tocar. Era o bug de "os botões não funcionam". */
    max-height:88vh;
    max-height:88dvh;
    overscroll-behavior:contain;
  }
  @media (min-width:560px){ .modal{border-radius:14px; margin:20px;} }
  .modal h2{
    font-family:'Space Mono',monospace; font-size:16px; margin:0 0 4px; text-transform:uppercase; letter-spacing:0.5px;
  }
  .modal p.sub{font-size:13px; color:var(--ink-light); margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-light); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.4px;}
  .field input[type=text], .field input[type=number], .field select{
    width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:10px 12px;
    border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink);
  }
  .toggle-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0;}
  .toggle-row label{font-size:14px; font-weight:500; margin:0;}
  .switch{position:relative; width:42px; height:24px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--border); border-radius:99px; cursor:pointer; transition:.15s;}
  .slider::before{content:''; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--green);}
  .switch input:checked + .slider::before{transform:translateX(18px);}
  .seg{display:flex; gap:6px; flex-wrap:wrap;}
  .seg button{
    font-family:'Space Mono',monospace; font-size:12px; padding:7px 11px; border-radius:99px;
    border:1px solid var(--border); background:#fff; cursor:pointer; color:var(--ink-light);
  }
  .seg button.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  /* Rodapé grudado no fim do modal: por mais que o conteúdo cresça (as
     sugestões de recompra deixaram este modal bem mais alto), Cancelar e
     Criar ficam sempre alcançáveis sem depender de rolagem. */
  .modal-buttons{
    display:flex; gap:10px; margin-top:18px;
    position:sticky; bottom:0; z-index:2;
    background:var(--paper);
    padding:12px 0 calc(16px + env(safe-area-inset-bottom));
    margin-left:-18px; margin-right:-18px; padding-left:18px; padding-right:18px;
    border-top:1px solid var(--border);
  }
  .modal-buttons button{
    flex:1; font-family:'Space Mono',monospace; font-weight:700; font-size:13px;
    padding:12px; border-radius:8px; cursor:pointer; border:1px solid var(--border);
    background:#fff; color:var(--ink);
  }
  .modal-buttons button.primary{background:var(--green); color:#fff; border-color:var(--green);}
  .modal-buttons button.danger{background:#fff; color:var(--red); border-color:var(--red);}
  .text-danger-link{
    display:block; width:100%; text-align:center; background:none; border:none;
    color:var(--red); font-family:'Space Mono',monospace; font-size:12px; padding:14px 0 0;
    cursor:pointer; text-decoration:underline;
  }

  .carry-item{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dotted var(--border);
  }
  .carry-item:last-child{border-bottom:none;}
  .carry-item .ci-name{flex:1; font-size:14px;}
  .carry-item .ci-name small{display:block; color:var(--ink-light); font-size:11px; font-family:'Space Mono',monospace;}
  .carry-toggle{
    font-family:'Space Mono',monospace; font-size:11px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--border); background:#fff; cursor:pointer; color:var(--ink-light);
  }
  .carry-toggle.keep{color:var(--green); border-color:var(--green); background:var(--green-light);}
  .carry-toggle.remove{color:var(--red); border-color:var(--red); background:#FBEAE5;}
  body.theme-dark .carry-toggle.remove{background:#3a201c;}

  .map-options{display:flex; flex-direction:column; gap:10px;}
  .map-option-btn{
    display:flex; align-items:center; gap:12px; padding:13px; border-radius:10px;
    border:1px solid var(--border); background:#fff; cursor:pointer; text-align:left;
  }
  body.theme-dark .map-option-btn{background:var(--card);}
  .map-option-btn .moi{font-size:20px;}
  .map-option-btn .mot strong{display:block; font-size:14px;}
  .map-option-btn .mot span{font-size:12px; color:var(--ink-light);}

  .toast{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--card); font-size:13px; padding:10px 16px;
    border-radius:999px; z-index:60; opacity:0; transition:opacity .2s, transform .2s;
    pointer-events:none; white-space:nowrap; font-family:'Space Mono',monospace;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .cat-chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .cat-chip{
    font-family:'Space Mono',monospace; font-size:11px; padding:5px 9px; border-radius:99px;
    border:1px solid var(--border); background:#fff; cursor:pointer; color:var(--ink-light);
  }
  .cat-chip.active{background:var(--amber); color:#fff; border-color:var(--amber);}
  body.theme-dark .cat-chip{background:var(--card);}

  /* ================= FASE 3 ================= */

  /* --- A1: tela de login --- */
  .auth-screen{
    position:fixed; inset:0; z-index:80; background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px;
    overflow-y:auto;
  }
  .auth-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:26px 22px; width:100%; max-width:380px; box-shadow:0 12px 30px -12px var(--shadow);
  }
  .auth-card h2{font-family:'Space Mono',monospace; font-size:17px; margin:0 0 6px; letter-spacing:0.5px;}
  .auth-card p.sub{font-size:13px; color:var(--ink-light); margin:0 0 18px; line-height:1.5;}
  .auth-card .field input{
    width:100%; font-family:'Inter',sans-serif; font-size:15px; padding:11px 12px;
    border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--ink);
  }
  body.theme-dark .auth-card .field input{background:var(--paper);}
  .auth-btn{
    width:100%; font-family:'Space Mono',monospace; font-weight:700; font-size:13.5px;
    padding:13px; border-radius:8px; cursor:pointer; border:1px solid var(--border);
    background:var(--card); color:var(--ink); margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .auth-btn.primary{background:var(--green); color:#fff; border-color:var(--green);}
  .auth-btn:disabled{opacity:.55; cursor:default;}
  .auth-sep{
    display:flex; align-items:center; gap:10px; margin:16px 0;
    font-size:11px; color:var(--ink-light); font-family:'Space Mono',monospace;
  }
  .auth-sep::before, .auth-sep::after{content:''; flex:1; border-top:1px dashed var(--border);}
  .auth-link{
    background:none; border:none; color:var(--green); font-size:12.5px; cursor:pointer;

  /* --- C1: modo compra --- */

  /* ================= FASE 4 · BLOCO G — colaboração ================= */

  .scope-pill{

  .invite-actions button{

  .role-badge{

  .item-tags{display:flex; align-items:center; gap:5px; margin-top:3px; flex-wrap:wrap;}

  body.theme-dark .viewer-note{background:#3a2f1c;}
</style>

<body>

<div class="auth-screen" id="authScreen" style="display:none;" role="dialog" aria-modal="true" aria-label="Entrar na conta"></div>

<script>
/* =================== STORAGE (local) =================== */
const STORAGE_KEY = 'shopping-app-data';
const SYNC_CONFIG_KEY = 'shopping-app-sync-config';
const BACKUP_KEY = 'shopping-app-backups';
const PREFS_KEY = 'shopping-app-prefs';
const METRICS_KEY = 'shopping-app-metrics';
const INSTALL_KEY = 'shopping-app-install-prompt';
const SCHEMA_VERSION = 3;

function emptyState(){
  return {
    schemaVersion: SCHEMA_VERSION,
    lists: [], activeListId: null, finishedLists: [],
    appMode: 'simple', theme: 'light', itemHistory: {},
    aisleOrders: {},          // C3: ordem de corredor por local ("__default__" ou nome do mercado)
    deleted: {},              // A4: lápides (ids removidos) para o merge não ressuscitar item apagado
    updatedAt: 0
  };
}

/* G: cada escopo (pessoal ou família) tem sua própria chave local, para que
   trocar de família não misture nem vaze dados de um contexto no outro. */
async function loadData(){
  try{
    const raw = localStorage.getItem(storageKeyForScope());
    if(raw) return JSON.parse(raw);
  }catch(e){ /* not found yet ou storage indisponível */ }
  return emptyState();
}
async function saveDataLocal(){
  try{ localStorage.setItem(storageKeyForScope(), JSON.stringify(state)); }
  catch(e){ console.error('Erro ao salvar', e); showToast('Não foi possível salvar agora'); }
}

/* A6: mantém as 3 últimas versões salvas localmente. É a rede de segurança
   contra um merge ruim, um "limpar dados do site" ou um bug de sincronização. */
const BACKUP_MIN_INTERVAL = 10 * 60 * 1000;
function writeRollingBackup(){
  try{
    const raw = localStorage.getItem(BACKUP_KEY + ':' + scope.type + ':' + (scope.id || 'eu'));
    const backups = raw ? JSON.parse(raw) : [];
    const last = backups[0];
    if(last && (Date.now() - last.at) < BACKUP_MIN_INTERVAL) return;
    backups.unshift({ at: Date.now(), payload: JSON.stringify(state) });
    localStorage.setItem(BACKUP_KEY + ':' + scope.type + ':' + (scope.id || 'eu'), JSON.stringify(backups.slice(0,3)));
  }catch(e){ /* cota estourada: backup é melhor-esforço, nunca bloqueia o app */ }
}

async function saveData(){
  state.updatedAt = Date.now();
  await saveDataLocal();
  writeRollingBackup();
  scheduleCloudSync();
}

/* A4: toda mutação passa por aqui para carimbar o horário no nível do item/lista.
   Sem esse carimbo o merge entre dispositivos não tem como decidir quem venceu. */
function touch(obj){
  if(obj) obj.updatedAt = Date.now();
  return obj;
}
function touchList(list){
  if(list) list.updatedAt = Date.now();
  return list;
}
function markDeleted(id){
  if(!state.deleted) state.deleted = {};
  state.deleted[id] = Date.now();
  // poda lápides com mais de 30 dias para o documento não crescer sem parar
  const cutoff = Date.now() - 30*86400000;
  Object.keys(state.deleted).forEach(k=>{ if(state.deleted[k] < cutoff) delete state.deleted[k]; });
}

let state = emptyState();

/* =================== FIREBASE / FIRESTORE =================== */
// Cole aqui o objeto de configuração do seu projeto Firebase
// (Console do Firebase -> Configurações do projeto -> Seus apps -> Config)
// Esses valores NÃO são secretos; a proteção real vem das Regras de Segurança do Firestore.
const firebaseConfig = {
  apiKey: "AIzaSyAddb0kDSzS6OFmQ1dhHnkRQ-5FMcw4IBs",
  authDomain: "lista-de-compras-bc2dc.firebaseapp.com",
  projectId: "lista-de-compras-bc2dc",
  storageBucket: "lista-de-compras-bc2dc.appspot.com",
  messagingSenderId: "134999197792",
  appId: "1:134999197792:web:2c21a82bf3da1ccb7d9b05"
};

const COLLECTION_NAME = 'shoppingLists';
let db = null;
let auth = null;
let firebaseReady = false;
try{
  if(firebaseConfig.apiKey !== 'COLE_AQUI'){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    auth = firebase.auth();
    firebaseReady = true;
    // A5: cache offline do próprio Firestore. Escritas feitas sem rede ficam
    // enfileiradas no IndexedDB e sobem sozinhas quando a conexão volta.
    db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
      // failed-precondition = várias abas sem suporte; unimplemented = navegador antigo.
      console.warn('Persistência offline indisponível:', err && err.code);
    });
  }
}catch(e){
  console.warn('Firebase não inicializado', e);
}

/* A3: o app aponta para um único projeto Firebase (o do produto).
   Ninguém mais precisa criar projeto próprio: basta abrir e entrar. */

let authUser = null;                 // usuário logado do Firebase Auth (ou null)
let localOnly = false;               // "usar sem conta": tudo fica só neste aparelho
let syncStatus = 'local';            // local | syncing | synced | offline | error
let unsubscribeSnapshot = null;
let applyingRemoteUpdate = false;    // evita loop: ignora o eco do próprio salvamento

/* Config legada da Fase 2 (código de sincronização digitado à mão).
   Só continua existindo para permitir a migração (A2). */
let legacySync = { ownerId: '', enabled: false };
function loadLegacySyncConfig(){
  try{
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if(raw) legacySync = JSON.parse(raw);
  }catch(e){ /* sem config legada */ }
}

function loadPrefs(){
  try{
    const raw = localStorage.getItem(PREFS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function savePrefs(p){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify(p)); }catch(e){}
}

/* ---------- D3: status de sincronização legível ---------- */
const SYNC_LABELS = {
  local:   'só neste aparelho',
  syncing: 'sincronizando...',
  synced:  'salvo na nuvem',
  offline: 'offline · salvo aqui',
  error:   'erro ao sincronizar'
};
function setSyncStatus(s){
  syncStatus = s;
  const pill = document.getElementById('syncPill');
  const txt = document.getElementById('syncPillText');
  if(pill){ pill.className = 'sync-pill s-' + s; }
  if(txt){ txt.textContent = SYNC_LABELS[s] || s; }
  const btn = document.getElementById('syncBtn');
  if(btn){
    const colors = { local:'var(--ink-light)', syncing:'var(--amber)', synced:'var(--green)', error:'var(--red)', offline:'var(--amber)' };
    btn.style.color = colors[s] || 'var(--ink)';
  }
}
window.addEventListener('online',  ()=>{ if(authUser) setSyncStatus('syncing'); });
window.addEventListener('offline', ()=>{ if(authUser) setSyncStatus('offline'); });

/* ---------- A1: o documento passa a ser o uid, nunca um texto digitado ---------- */
function getDocRef(ownerId){
  if(!db) return null;
  if(!ownerId && scope.type === 'household' && scope.id){
    return db.collection(HOUSEHOLD_COLLECTION).doc(scope.id);
  }
  const id = ownerId || (authUser && authUser.uid);
  if(!id) return null;
  return db.collection(COLLECTION_NAME).doc(id);
}

let syncDebounceTimer = null;
function scheduleCloudSync(){
  if(!firebaseReady || !authUser) return;
  if(applyingRemoteUpdate) return; // não reenviar o que acabamos de receber da nuvem
  clearTimeout(syncDebounceTimer);
  syncDebounceTimer = setTimeout(pushToCloud, 1000);
}

async function pushToCloud(){
  const ref = getDocRef();
  if(!ref) return;
  // G: quem só tem leitura não escreve. A regra de segurança também barra,
  // mas errar aqui evita um erro de permissão a cada toque.
  if(scope.type === 'household' && !canEdit()) return;
  if(syncStatus !== 'offline') setSyncStatus('syncing');
  try{
    if(scope.type === 'household'){
      // update parcial: o documento da família também guarda membros e
      // convites, que não podem ser sobrescritos pelo estado das listas
      await ref.update({ state, updatedAt: state.updatedAt, schemaVersion: SCHEMA_VERSION });
    } else {
      await ref.set({ state, updatedAt: state.updatedAt, schemaVersion: SCHEMA_VERSION }, { merge: false });
    }
    setSyncStatus(navigator.onLine ? 'synced' : 'offline');
  }catch(e){
    console.error('Erro ao sincronizar (envio)', e);
    setSyncStatus(navigator.onLine ? 'error' : 'offline');
  }
}

/* =================== A4: MERGE POR ITEM ===================
   O problema da Fase 2: o estado inteiro era um documento só e a última
   escrita apagava a anterior. Duas pessoas mexendo ao mesmo tempo perdiam
   dados em silêncio. Aqui a reconciliação é por registro, usando o
   updatedAt de cada item/lista, com lápides para não ressuscitar o que
   foi apagado de propósito no outro aparelho.
   Esta função é pura: não toca no DOM nem no estado global (é a que os
   testes unitários do bloco D6 exercitam). */
function mergeStates(local, remote){
  if(!remote) return local;
  if(!local) return remote;

  const out = {
    schemaVersion: SCHEMA_VERSION,
    // preferências de exibição são do aparelho, não da conta: local sempre vence
    appMode: local.appMode || remote.appMode || 'simple',
    theme: local.theme || remote.theme || 'light',
    activeListId: local.activeListId || remote.activeListId || null,
    lists: [],
    finishedLists: [],
    itemHistory: {},
    aisleOrders: {},
    deleted: mergeTombstones(local.deleted, remote.deleted),
    updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0)
  };

  const isDeleted = (id, updatedAt)=>{
    const t = out.deleted[id];
    return t != null && t >= (updatedAt || 0);
  };

  /* --- listas --- */
  const listIndex = new Map();
  const consider = (l)=>{
    if(!l || !l.id) return;
    if(isDeleted(l.id, l.updatedAt)) return;   // apagada de propósito no outro aparelho
    const prev = listIndex.get(l.id);
    listIndex.set(l.id, prev ? mergeListPair(prev, l, isDeleted) : l);
  };
  (local.lists || []).forEach(consider);
  (remote.lists || []).forEach(consider);
  out.lists = Array.from(listIndex.values());

  /* --- histórico de compras finalizadas: união por id, mais recente vence --- */
  const finIndex = new Map();
  [...(remote.finishedLists || []), ...(local.finishedLists || [])].forEach(f=>{
    if(!f || !f.id) return;
    if(isDeleted(f.id, f.finishedAt)) return;
    const prev = finIndex.get(f.id);
    if(!prev || (f.finishedAt || 0) > (prev.finishedAt || 0)) finIndex.set(f.id, f);
  });
  out.finishedLists = Array.from(finIndex.values()).sort((a,b)=> (b.finishedAt||0) - (a.finishedAt||0));

  /* --- histórico de itens digitados: soma de conhecimento, nunca conflito --- */
  const rh = remote.itemHistory || {}, lh = local.itemHistory || {};
  Object.keys(Object.assign({}, rh, lh)).forEach(k=>{
    const a = lh[k], b = rh[k];
    if(!a){ out.itemHistory[k] = b; return; }
    if(!b){ out.itemHistory[k] = a; return; }
    const newer = (a.lastUsed || 0) >= (b.lastUsed || 0) ? a : b;
    out.itemHistory[k] = Object.assign({}, newer, { count: Math.max(a.count||0, b.count||0) });
  });

  /* --- ordem dos corredores: por chave de local, mais recente vence --- */
  const ra = remote.aisleOrders || {}, la = local.aisleOrders || {};
  Object.keys(Object.assign({}, ra, la)).forEach(k=>{
    const a = la[k], b = ra[k];
    if(!a){ out.aisleOrders[k] = b; return; }
    if(!b){ out.aisleOrders[k] = a; return; }
    out.aisleOrders[k] = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  });

  if(!out.lists.find(l=> l.id === out.activeListId)){
    out.activeListId = out.lists.length ? out.lists[0].id : null;
  }
  return out;
}

function mergeTombstones(a, b){
  const out = Object.assign({}, b || {});
  Object.keys(a || {}).forEach(k=>{ out[k] = Math.max(out[k] || 0, a[k]); });
  return out;
}

/* Reconcilia duas versões da MESMA lista. Metadados pelo updatedAt da lista;
   itens um a um pelo updatedAt do item. */
function mergeListPair(a, b, isDeleted){
  const newer = (a.updatedAt || 0) >= (b.updatedAt || 0) ? a : b;
  const merged = Object.assign({}, newer);

  const itemIndex = new Map();
  const consider = (it)=>{
    if(!it || !it.id) return;
    if(isDeleted(it.id, it.updatedAt)) return;
    const prev = itemIndex.get(it.id);
    if(!prev){ itemIndex.set(it.id, it); return; }
    itemIndex.set(it.id, (it.updatedAt || 0) > (prev.updatedAt || 0) ? it : prev);
  };
  (a.items || []).forEach(consider);
  (b.items || []).forEach(consider);

  // preserva a ordem manual do lado mais recente e acrescenta o que só existe no outro
  const orderSource = (newer.items || []).map(i=>i.id);
  const ordered = [];
  orderSource.forEach(id=>{ if(itemIndex.has(id)){ ordered.push(itemIndex.get(id)); itemIndex.delete(id); } });
  itemIndex.forEach(it=> ordered.push(it));
  merged.items = ordered;
  merged.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return merged;
}

/* Escuta em tempo real: assim que qualquer dispositivo salvar, este listener
   dispara sozinho (sem polling, sem precisar tocar em botão nenhum). */
function startRealtimeSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  const ref = getDocRef();
  if(!ref) return;
  setSyncStatus('syncing');
  unsubscribeSnapshot = ref.onSnapshot({ includeMetadataChanges: true }, (snap)=>{
    if(snap.metadata.fromCache && !navigator.onLine){ setSyncStatus('offline'); return; }
    if(!snap.exists){
      if(scope.type === 'household'){
        // a família foi excluída por outra pessoa
        showToast('Esta família não existe mais');
        switchScope({ type:'personal', id:null, name:'Minhas listas' });
        return;
      }
      pushToCloud();
      return;
    }
    if(snap.metadata.hasPendingWrites){ return; } // eco da própria escrita
    const data = snap.data();

    // G: no documento de família vêm também os membros e o papel de cada um
    if(scope.type === 'household'){
      currentHousehold = data;
      if(data.name && data.name !== scope.name){
        scope.name = data.name;
        const p = loadPrefs(); if(p.scope) p.scope.name = data.name; savePrefs(p);
      }
      applyScopeToHeader();
    }

    if(!data || !data.state){ setSyncStatus('synced'); return; }

    const merged = mergeStates(state, normalizeState(data.state));
    const changed = JSON.stringify(merged) !== JSON.stringify(state);
    if(changed){
      const antes = state;
      applyingRemoteUpdate = true;
      state = merged;
      saveDataLocal();
      writeRollingBackup();
      render();
      if(scope.type === 'household'){
        notifyRemoteChange(descreverMudanca(antes, merged));
      } else {
        showToast('Atualizado por outro aparelho');
      }
      applyingRemoteUpdate = false;
      // se o merge produziu algo que a nuvem ainda não tem, devolve
      if(JSON.stringify(merged) !== JSON.stringify(data.state)) scheduleCloudSync();
    }
    setSyncStatus('synced');
  }, (err)=>{
    console.error('Erro no listener de sincronização', err);
    setSyncStatus('error');
  });
}

function stopRealtimeSync(){
  if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  setSyncStatus('local');
}

/* =================== A2: MIGRAÇÃO DO CÓDIGO DE SINCRONIZAÇÃO =================== */
/* Quem usava a Fase 2 tem dados num documento identificado por um texto
   digitado à mão. No primeiro login, trazemos esses dados para a conta —
   por merge, nunca por substituição — e só então marcamos como migrado. */
async function migrateLegacyIfNeeded(){
  const prefs = loadPrefs();
  if(prefs.legacyMigrated) return;
  if(!legacySync.ownerId || legacySync.ownerId === (authUser && authUser.uid)){
    prefs.legacyMigrated = true; savePrefs(prefs); return;
  }
  try{
    const snap = await db.collection(COLLECTION_NAME).doc(legacySync.ownerId).get();
    if(snap.exists){
      const data = snap.data();
      if(data && data.state){
        state = mergeStates(normalizeState(state), normalizeState(data.state));
        await saveData();
        showToast('Listas do código de sincronização importadas');
        trackEvent('legacy_migrated');
      }
    }
  }catch(e){
    console.warn('Não foi possível migrar os dados do código antigo', e);
    showToast('Não foi possível importar os dados antigos automaticamente');
  }
  prefs.legacyMigrated = true; savePrefs(prefs);
}

const DEFAULT_UNITS = ['','un','kg','g','L','ml','pacote','caixa','dz'];
let currentSearch = '';

function uid(){ return Math.random().toString(36).slice(2,10); }

function getActiveList(){
  return state.lists.find(l => l.id === state.activeListId) || null;

/* =================== NORMALIZAÇÃO / MIGRAÇÃO DE ESQUEMA =================== */
/* Todo estado que entra no app (local, nuvem ou arquivo importado) passa por
   aqui. Garante os campos novos da Fase 3 sem quebrar dados da Fase 2. */
function normalizeState(s){
  const base = emptyState();
  if(!s || typeof s !== 'object') return base;
  const out = Object.assign(base, s);
  out.schemaVersion = SCHEMA_VERSION;
  out.lists = Array.isArray(out.lists) ? out.lists : [];
  out.finishedLists = Array.isArray(out.finishedLists) ? out.finishedLists : [];
  out.itemHistory = out.itemHistory && typeof out.itemHistory === 'object' ? out.itemHistory : {};
  out.aisleOrders = out.aisleOrders && typeof out.aisleOrders === 'object' ? out.aisleOrders : {};
  out.deleted = out.deleted && typeof out.deleted === 'object' ? out.deleted : {};
  if(out.appMode !== 'full') out.appMode = out.appMode === 'simple' ? 'simple' : 'simple';
  if(out.theme !== 'dark') out.theme = 'light';
  out.updatedAt = out.updatedAt || 0;

  const stamp = out.updatedAt || Date.now();
  out.lists.forEach(l=>{
    if(!l.id) l.id = uid();
    if(!l.recurring) l.recurring = { enabled:false, frequencyDays:7 };
    if(!l.createdAt) l.createdAt = stamp;
    if(!l.updatedAt) l.updatedAt = l.createdAt;      // A4: listas antigas ganham carimbo
    if(!Array.isArray(l.items)) l.items = [];
    l.items.forEach(it=>{
      if(!it.id) it.id = uid();
      if(it.qty == null || it.qty === '') it.qty = '1';
      if(it.unit == null) it.unit = '';
      if(it.category == null) it.category = '';
      if(it.price === undefined) it.price = null;
      if(it.addedBy === undefined) it.addedBy = null;
      if(it.boughtBy === undefined) it.boughtBy = null;
      if(it.assignedTo === undefined) it.assignedTo = null;
      it.bought = !!it.bought;
      if(!it.updatedAt) it.updatedAt = l.updatedAt;  // A4: itens antigos ganham carimbo
    });
  });
  out.finishedLists.forEach(f=>{
    if(!f.id) f.id = uid();
    if(!Array.isArray(f.items)) f.items = [];
    if(!f.finishedAt) f.finishedAt = f.createdAt || stamp;
  });
  return out;
}

/* =================== INIT =================== */
async function init(){
  state = normalizeState(await loadData());
  loadLegacySyncConfig();
  const prefs = loadPrefs();
  localOnly = !!prefs.localOnly;
  loadUiPrefs();
  if(prefs.scope && prefs.scope.type === 'household' && prefs.scope.id){
    scope = { type:'household', id: prefs.scope.id, name: prefs.scope.name || 'Família' };
    state = normalizeState(await loadData());   // recarrega já na chave do escopo
  }

  if(state.lists.length === 0){
    // primeira vez: cria uma lista de exemplo "Mercado"
    const l = createListObject('Mercado', false, 7);
    state.lists.push(l);
    state.activeListId = l.id;
    await saveData();
  }
  if(!state.activeListId || !getActiveList()){
    state.activeListId = state.lists[0].id;
  }
  render();
  setSyncStatus('local');

  // atalho do manifest.json ("Nova lista" ao segurar o ícone do app)
  try{
    const qs = new URLSearchParams(location.search);
    if(qs.get('acao') === 'nova-lista'){
      history.replaceState(null, '', location.pathname);
      openNewListModal();
    }
    // G: convite chegou pelo link. Guardamos porque o login pode vir antes.
    const convite = qs.get('convite');
    if(convite){
      convitePendente = convite.trim().toUpperCase();
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(e=> console.warn('Falha ao registrar service worker', e));
  }
  setupInstallPrompt();

  if(!firebaseReady){
    localOnly = true;
    return;
  }

  auth.onAuthStateChanged(async (user)=>{
    authUser = user || null;
    if(user){
      hideAuthScreen();
      setSyncStatus('syncing');
      await migrateLegacyIfNeeded();
      watchMyHouseholds();                       // G
      startRealtimeSync();
      if(scope.type === 'household') startPresence();
      applyScopeToHeader();
      render();
      trackEvent('session_start');
      await tratarConviteDaUrl();                // G
    } else {
      stopRealtimeSync();
      stopPresence();
      if(unsubHouseholds){ unsubHouseholds(); unsubHouseholds = null; }
      myHouseholds = []; currentHousehold = null;
      scope = { type:'personal', id:null, name:'Minhas listas' };
      applyScopeToHeader();
      if(localOnly){ hideAuthScreen(); setSyncStatus('local'); }
      else renderAuthScreen('login');
      render();
    }
  });
}

function createListObject(name, recurring, frequencyDays, baseName){
  return {
    id: uid(),
    name: name,
    baseName: baseName || name,
    recurring: { enabled: !!recurring, frequencyDays: frequencyDays || 7 },
    createdAt: Date.now(),
    updatedAt: Date.now(),
    location: null, // {type:'auto'} ou {type:'address', value:'...'}
    items: []
  };
}

function makeItem(fields){
  return Object.assign({
    id: uid(), name:'', qty:'1', unit:'', category:'', price:null, bought:false,
    updatedAt: Date.now(),
    // G: autoria. Em listas pessoais fica nulo e não aparece em lugar nenhum.
    addedBy: (scope.type === 'household' ? myUid() : null),
    boughtBy: null,
    assignedTo: null
  }, fields || {});
}

/* =================== RENDER =================== */
function render(){
  const isFull = isFullMode();
  document.body.classList.toggle('theme-dark', isFull && state.theme === 'dark');
  document.body.classList.toggle('shop-mode', !!shopMode.active);
  document.querySelectorAll('#modeSwitch .mode-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.mode === state.appMode);
  });
  const themeBtn = document.getElementById('themeToggleBtn');
  themeBtn.style.display = isFull ? 'flex' : 'none';
  themeBtn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
  document.querySelectorAll('.shop-foot').forEach(el=> el.remove());
  applyScopeToHeader();
  if(shopMode.active){
    renderShopMode();
    return;
  }
  renderTabs();
  renderMain();
}

function renderTabs(){
  const isFull = isFullMode();
  const row = document.getElementById('tabsRow');
  row.innerHTML = '';
  state.lists.forEach(l=>{
    const tab = document.createElement('button');
    tab.className = 'tab' + (l.id === state.activeListId ? ' active' : '');
    const overdue = isFull && l.recurring.enabled && (Date.now() > (l.createdAt + (l.recurring.frequencyDays||7)*86400000));
    tab.innerHTML = (l.recurring.enabled ? '<span class="rec-mark">&#8635;</span> ' : '') +
      (overdue ? '<span class="overdue-dot">&#9679;</span> ' : '') + escapeHtml(l.name);
    tab.onclick = ()=>{ currentSearch=''; state.activeListId = l.id; saveData(); render(); };
    row.appendChild(tab);
  });
  const addTab = document.createElement('button');
  addTab.className = 'tab add-tab';
  addTab.textContent = '+ nova lista';
  addTab.onclick = openNewListModal;
  row.appendChild(addTab);
}

function renderMain(){
  const isFull = isFullMode();
  const main = document.getElementById('mainArea');
  main.innerHTML = '';
  const list = getActiveList();
  if(!list){
    main.innerHTML = `<div class="empty-state">
      <div class="big">🧺</div>
      <h2>Nenhuma lista ainda</h2>
      <p>Crie sua primeira lista de compras para começar a organizar suas idas ao mercado.</p>
    </div>`;
    return;
  }

  const total = list.items.length;
  const bought = list.items.filter(i=>i.bought).length;
  const totalEstimate = list.items.reduce((sum, it)=>{
    const price = parseFloat(it.price);
    if(isNaN(price)) return sum;
    const qty = parseFloat(it.qty);
    return sum + price * (isNaN(qty) ? 1 : qty);
  }, 0);

  const receipt = document.createElement('div');
  receipt.className = 'receipt';

  // head
  const metaParts = [];
  if(list.recurring.enabled) metaParts.push(`<span class="rec-badge">&#8635; recorrente · a cada ${list.recurring.frequencyDays}d</span>`);
  metaParts.push(new Date(list.createdAt).toLocaleDateString('pt-BR'));
  if(isFull){
    const overdue = list.recurring.enabled && (Date.now() > (list.createdAt + (list.recurring.frequencyDays||7)*86400000));
    if(overdue) metaParts.push(`<span class="overdue-badge">&#9888; recorrência atrasada</span>`);
  }

  receipt.innerHTML = `
    <div class="receipt-head">
      <p class="list-name">${escapeHtml(list.name)}</p>
      <div class="list-meta">${metaParts.join(' · ')}</div>
    </div>
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" style="width:${total? Math.round(bought/total*100):0}%"></div></div>
      <div class="progress-label">${bought} de ${total} ${total===1?'item':'itens'}</div>
    </div>
    ${isFull ? `<div class="total-row">Total estimado: <strong>${formatPrice(totalEstimate)}</strong></div>` : ''}
    ${isFull ? `<div class="search-row"><input type="text" id="searchInput" placeholder="Buscar item na lista..." aria-label="Buscar item na lista"></div>` : ''}
    ${scope.type === 'household' && !canEdit()
      ? '<div class="viewer-note">Você tem acesso <strong>somente leitura</strong> nesta família. Dá para acompanhar tudo, mas não alterar. Peça ao responsável para mudar sua permissão.</div>'
      : ''}
    ${scope.type === 'household' ? '<div class="presence-bar" id="presenceNote" aria-live="polite"></div>' : ''}
    <div class="list-tools">
      <button type="button" id="toggleBoughtBtn" class="${uiPrefs.hideBought ? 'on' : ''}" aria-pressed="${uiPrefs.hideBought ? 'true' : 'false'}">
        ${uiPrefs.hideBought ? '☑ comprados ocultos' : '☐ ocultar comprados'}
      </button>
      ${isFull ? `<button type="button" id="aisleBtn">↕ ordem dos corredores</button>` : '<span></span>'}
    </div>
    ${isFull ? `<div class="cat-chip-row" id="favChipRow"></div>` : ''}
    <div id="categoriesArea"></div>

    <div class="quick-add" ${scope.type === 'household' && !canEdit() ? 'style="display:none;"' : ''}>
      <input type="text" id="quickAddInput" placeholder="2kg tomate" aria-label="Adicionar item rapidamente"${isFull ? ' list="itemNamesDatalist"' : ''} autocomplete="off" enterkeyhint="done">
      <button type="button" class="qa-icon" id="quickMicBtn" title="Ditar itens" aria-label="Ditar itens por voz">🎤</button>
      <button type="button" class="qa-icon go" id="quickAddBtn" aria-label="Adicionar item">+</button>
    </div>
    <div class="qa-preview" id="qaPreview" aria-live="polite"></div>
    <p class="qa-hint">Digite quantidade, unidade e nome juntos — <strong>2kg tomate</strong>, <strong>3 leite</strong>, <strong>500g queijo</strong>. Várias linhas de uma vez também funcionam.</p>
    <button type="button" class="adv-toggle" id="advToggle" aria-expanded="${uiPrefs.advancedForm ? 'true' : 'false'}" aria-controls="addItemForm">
      ${uiPrefs.advancedForm ? '− esconder campos detalhados' : '+ campos detalhados (categoria, preço)'}
    </button>
    <div class="add-item-form" id="addItemForm" style="${uiPrefs.advancedForm ? '' : 'display:none;'}">
      <input type="text" class="f-name" id="newItemName" placeholder="Item (ex: Tomate)" aria-label="Nome do item"${isFull ? ' list="itemNamesDatalist"' : ''}>
      <input type="text" class="f-qty" id="newItemQty" placeholder="1" aria-label="Quantidade">
      ${isFull ? `<select class="f-unit" id="newItemUnit" aria-label="Unidade">${DEFAULT_UNITS.map(u=>`<option value="${u}">${u===''?'Un.':escapeHtml(u)}</option>`).join('')}</select>` : ''}
      <select class="f-cat" id="newItemCat" aria-label="Categoria"></select>
      ${isFull ? `<input type="text" class="f-price" id="newItemPrice" placeholder="R$" aria-label="Preço estimado">` : ''}
      <button type="button" id="addItemBtn">Add</button>
    </div>
    ${isFull ? `<datalist id="itemNamesDatalist"></datalist>` : ''}
  `;
  main.appendChild(receipt);

  /* --- C5: ocultar comprados --- */
  receipt.querySelector('#toggleBoughtBtn').onclick = ()=>{
    uiPrefs.hideBought = !uiPrefs.hideBought;
    saveUiPrefs();
    render();
  };
  if(isFull){
    receipt.querySelector('#aisleBtn').onclick = ()=> openAisleOrderModal(list);
  }

  /* --- B1/B2/B3: entrada rápida --- */
  const qaInput = receipt.querySelector('#quickAddInput');
  const qaPreview = receipt.querySelector('#qaPreview');
  qaInput.addEventListener('input', ()=>{
    const raw = qaInput.value.trim();
    if(!raw){ qaPreview.textContent = ''; return; }
    const p = parseQuickItem(raw);
    const cat = p.category || guessCategory(p.name);
    qaPreview.textContent = `→ ${p.qty}${p.unit ? ' ' + p.unit : 'x'} ${p.name}${cat ? ' · ' + cat : ''}`;
  });
  qaInput.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); submitQuickAdd(list, qaInput); }
  });
  qaInput.addEventListener('paste', e=>{
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if(text && text.indexOf('\n') !== -1){
      e.preventDefault();
      const n = addItemsFromText(list, text);
      showToast(n === 1 ? '1 item adicionado' : n + ' itens adicionados');
      qaInput.value = ''; qaPreview.textContent = '';
      render();
    }
  });
  receipt.querySelector('#quickAddBtn').onclick = ()=> submitQuickAdd(list, qaInput);
  const micBtn = receipt.querySelector('#quickMicBtn');
  if(speechSupported()) micBtn.onclick = ()=> startVoiceCapture(list, micBtn, qaInput);
  else micBtn.style.display = 'none';

  receipt.querySelector('#advToggle').onclick = ()=>{
    uiPrefs.advancedForm = !uiPrefs.advancedForm;
    saveUiPrefs();
    render();
  };

  // categorias usadas + dropdown (em branco/"Sem categoria" por padrão)
  const usedCats = Array.from(new Set(list.items.map(i=>i.category))).filter(c=>c);
  const allCats = Array.from(new Set([...DEFAULT_CATEGORIES, ...usedCats]));
  const catSelect = receipt.querySelector('#newItemCat');
  const optNone = document.createElement('option');
  optNone.value = ''; optNone.textContent = 'Sem categoria';
  catSelect.appendChild(optNone);
  allCats.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSelect.appendChild(opt);
  });
  const optOther = document.createElement('option');
  optOther.value = '__nova__'; optOther.textContent = '+ nova categoria';
  catSelect.appendChild(optOther);

  // recursos extras da versão completa: datalist de nomes + favoritos
  if(isFull){
    const datalist = receipt.querySelector('#itemNamesDatalist');
    Object.values(state.itemHistory || {}).forEach(h=>{
      const opt = document.createElement('option');
      opt.value = h.name;
      datalist.appendChild(opt);
    });

    const favRow = receipt.querySelector('#favChipRow');
    const favs = Object.values(state.itemHistory || {}).sort((a,b)=> (b.count||0) - (a.count||0)).slice(0,8);
    favs.forEach(f=>{
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'cat-chip';
      chip.textContent = '+ ' + f.name;
      chip.title = 'Adicionar rapidamente';
      chip.onclick = ()=> quickAddFromHistory(list, f);
      favRow.appendChild(chip);
    });

    const searchInput = receipt.querySelector('#searchInput');
    searchInput.value = currentSearch;
    searchInput.addEventListener('input', (e)=>{
      currentSearch = e.target.value;
      applySearchFilter(currentSearch);
    });

    receipt.querySelector('#newItemName').addEventListener('input', (e)=>{
      const key = e.target.value.trim().toLowerCase();
      const hist = state.itemHistory && state.itemHistory[key];
      if(!hist) return;
      const unitSel = document.getElementById('newItemUnit');
      const priceInp = document.getElementById('newItemPrice');
      if(unitSel && !unitSel.value) unitSel.value = hist.unit || '';
      if(catSelect && !catSelect.value && hist.category){
        const opt = Array.from(catSelect.options).find(o=>o.value===hist.category);
        if(opt) catSelect.value = hist.category;
      }
      if(priceInp && !priceInp.value && hist.price != null) priceInp.value = hist.price;

  const grouped = {};
  visibleItems.forEach(it=>{
    if(!grouped[it.category]) grouped[it.category] = [];
    grouped[it.category].push(it);
  });
  Object.keys(grouped).forEach(cat=>{
    grouped[cat].sort((a,b)=> (a.bought === b.bought) ? 0 : (a.bought ? 1 : -1));

  } else {

      const block = document.createElement('div');

  actions.querySelector('#recurBtn').onclick = ()=> openRecurringSettingsModal(list);
  actions.querySelector('#finishBtn').onclick = ()=> openFinishModal(list);
  if(isFull){

    const q = document.getElementById('quickAddInput');

function atualizarNotaDePresenca(){
  const bar = document.getElementById('presenceNote');
  if(!bar) return;
  const comprando = presenceOnline.filter(p=> p.shopping && p.uid !== myUid());
  bar.textContent = comprando.length
    ? `${comprando.map(p=>p.name).join(' e ')} ${comprando.length>1?'estão':'está'} no mercado agora`
    : '';
}

function applySearchFilter(query){
  const q = (query || '').trim().toLowerCase();
  document.querySelectorAll('.category-block').forEach(block=>{
    let anyVisible = false;
    block.querySelectorAll('.item-row').forEach(row=>{
      const match = !q || (row.dataset.name || '').includes(q);
      row.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
    });
    block.style.display = anyVisible ? '' : 'none';
  });
}

function renderItemRow(item, list, isFull, siblings, idxInGroup){
  const row = document.createElement('div');
  row.className = 'item-row' + (item.bought ? ' bought' : '');
  row.dataset.name = item.name.toLowerCase();
  row.dataset.id = item.id;
  row.dataset.category = item.category || '';
  row.dataset.bought = String(!!item.bought);
  const qtyDisplay = item.unit ? `${escapeHtml(String(item.qty))} ${escapeHtml(item.unit)}` : escapeHtml(String(item.qty));
  const showPrice = isFull && item.price != null && item.price !== '' && !isNaN(item.price);
  const first = idxInGroup === 0;
  const last = siblings ? idxInGroup === siblings.length - 1 : true;
  row.innerHTML = `
    <button class="check" aria-label="${item.bought ? 'Desmarcar' : 'Marcar como comprado'}: ${escapeHtml(item.name)}" aria-pressed="${item.bought ? 'true' : 'false'}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 18 20 6"/></svg>
    </button>
    <div class="item-main">
      <div class="item-name-row">
        <span class="item-name">${escapeHtml(item.name)}</span>
      </div>
      ${showPrice ? `<div class="item-price">${formatPrice(item.price)}</div>` : ''}
      ${itemTagsHtml(item)}
    </div>
    <span class="item-qty">${qtyDisplay}</span>
    ${isFull ? `
      <span class="reorder-btns" role="group" aria-label="Reordenar ${escapeHtml(item.name)}">
        <button class="ro-up" aria-label="Mover ${escapeHtml(item.name)} para cima" ${first ? 'disabled' : ''}>▲</button>
        <button class="ro-down" aria-label="Mover ${escapeHtml(item.name)} para baixo" ${last ? 'disabled' : ''}>▼</button>
      </span>
      <span class="drag-handle" aria-hidden="true" title="Arraste para reordenar">⠿</span>
      <button class="item-edit" aria-label="Editar ${escapeHtml(item.name)}">✎</button>
      ${scope.type === 'household' ? `<button class="item-edit item-assign" aria-label="Definir quem pega ${escapeHtml(item.name)}">👤</button>` : ''}
    ` : ''}
    <button class="item-del" aria-label="Remover ${escapeHtml(item.name)}">&times;</button>
  `;
  const toggle = ()=>{
    if(!canEdit()){ showToast('Você tem acesso somente leitura nesta família'); return; }
    item.bought = !item.bought;
    item.boughtBy = item.bought ? (scope.type === 'household' ? myUid() : null) : null;
    touch(item); touchList(list);
    if(item.bought) trackEvent('item_checked');
    saveData(); render();
  };
  row.querySelector('.check').onclick = (e)=>{ e.stopPropagation(); toggle(); };

  /* C4: exclusão reversível. Nada de confirmar duas vezes: apaga na hora e
     dá 6 segundos de "desfazer" — mais rápido de acertar e de errar sem custo. */
  row.querySelector('.item-del').onclick = (e)=>{
    e.stopPropagation();
    if(!canEdit()){ showToast('Você tem acesso somente leitura nesta família'); return; }
    const position = list.items.findIndex(i=>i.id === item.id);
    const removed = list.items[position];
    list.items = list.items.filter(i=>i.id !== item.id);
    markDeleted(item.id);
    touchList(list);
    saveData(); render();
    showUndoToast(`"${item.name}" removido`, ()=>{
      delete state.deleted[removed.id];
      touch(removed);
      list.items.splice(Math.min(position, list.items.length), 0, removed);
      touchList(list);
      saveData(); render();
    });
  };
  if(isFull){
    row.querySelector('.item-edit').onclick = (e)=>{ e.stopPropagation(); openEditItemModal(item, list); };
    const assignBtn = row.querySelector('.item-assign');
    if(assignBtn) assignBtn.onclick = (e)=>{ e.stopPropagation(); openAssignModal(item, list); };
    row.querySelector('.drag-handle').addEventListener('pointerdown', (e)=> startItemDrag(e, row, list));
    row.querySelector('.ro-up').onclick = (e)=>{ e.stopPropagation(); moveItemWithinGroup(list, item, siblings, -1); };
    row.querySelector('.ro-down').onclick = (e)=>{ e.stopPropagation(); moveItemWithinGroup(list, item, siblings, 1); };
  }
  if(shopMode.active){
    row.onclick = toggle;   // C1: no corredor, a linha inteira é o alvo
    row.setAttribute('role','button');
    row.tabIndex = 0;
    row.addEventListener('keydown', e=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); }
    });
  }
  return row;
}

/* G: etiquetas de autoria. Só existem no contexto de família — em lista
   pessoal seriam ruído puro ("adicionado por você" em 100% dos itens). */
function itemTagsHtml(item){
  if(scope.type !== 'household') return '';
  const tags = [];
  if(item.assignedTo){
    const nome = memberName(item.assignedTo);
    const mine = item.assignedTo === myUid();
    tags.push(`<span class="item-tag ${mine ? 'mine' : ''}">${avatarHtml(item.assignedTo, nome === 'você' ? myDisplayName() : nome, 'sm')}${mine ? 'você pega' : escapeHtml(nome)}</span>`);
  }
  if(item.bought && item.boughtBy && item.boughtBy !== myUid()){
    tags.push(`<span class="item-tag">${escapeHtml(memberName(item.boughtBy))} pegou</span>`);
  }
  if(!tags.length) return '';
  return `<div class="item-tags">${tags.join('')}</div>`;
}

/* D1: reordenação sem arrastar — funciona com teclado e com leitor de tela,
   que era a lacuna de acessibilidade herdada da Fase 1. */
function moveItemWithinGroup(list, item, siblings, delta){
  if(!siblings) return;
  const from = siblings.findIndex(i=>i.id === item.id);
  const to = from + delta;
  if(from < 0 || to < 0 || to >= siblings.length) return;
  const anchorId = siblings[to].id;
  const iFrom = list.items.findIndex(i=>i.id === item.id);
  const iTo = list.items.findIndex(i=>i.id === anchorId);
  if(iFrom < 0 || iTo < 0) return;
  list.items.splice(iFrom, 1);
  list.items.splice(iTo, 0, item);
  touchList(list);
  saveData(); render();
  const btn = document.querySelector(`.item-row[data-id="${item.id}"] .ro-${delta < 0 ? 'up' : 'down'}`);
  if(btn && !btn.disabled) btn.focus();
  announce(`${item.name} movido para a posição ${to + 1} de ${siblings.length}`);
}

/* =================== ARRASTAR PARA REORDENAR =================== */
function startItemDrag(e, row, list){
  e.preventDefault();
  const category = row.dataset.category;
  const bought = row.dataset.bought;
  row.classList.add('dragging');
  document.body.classList.add('dragging-active');

  function onMove(ev){
    const pointX = ev.clientX, pointY = ev.clientY;
    row.style.pointerEvents = 'none';
    const elAtPoint = document.elementFromPoint(pointX, pointY);
    row.style.pointerEvents = '';
    const targetRow = elAtPoint ? elAtPoint.closest('.item-row') : null;
    if(!targetRow || targetRow === row) return;
    if(targetRow.dataset.category !== category || targetRow.dataset.bought !== bought) return;
    const rect = targetRow.getBoundingClientRect();
    const before = (pointY - rect.top) < rect.height / 2;
    targetRow.parentNode.insertBefore(row, before ? targetRow : targetRow.nextSibling);
  }

  function onUp(){
    row.classList.remove('dragging');
    document.body.classList.remove('dragging-active');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    commitItemOrder(list);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function commitItemOrder(list){
  const orderedIds = Array.from(document.querySelectorAll('#categoriesArea .item-row')).map(r=>r.dataset.id);
  const byId = {};
  list.items.forEach(i=> byId[i.id] = i);
  const reordered = orderedIds.map(id=>byId[id]).filter(Boolean);
  // segurança: inclui qualquer item que não tenha sido encontrado no DOM (ex.: filtrado pela busca)
  list.items.forEach(i=>{ if(!reordered.includes(i)) reordered.push(i); });
  list.items = reordered;
  touchList(list);
  saveData();
  render();
}

function updateItemHistory(item){
  if(!state.itemHistory) state.itemHistory = {};
  const key = (item.name || '').trim().toLowerCase();
  if(!key) return;
  const existing = state.itemHistory[key] || { count: 0 };
  state.itemHistory[key] = {
    name: item.name.trim(),
    category: item.category,
    unit: item.unit || '',
    price: (item.price !== undefined && item.price !== null && item.price !== '' && !isNaN(item.price)) ? item.price : (existing.price != null ? existing.price : null),
    count: (existing.count || 0) + 1,
    lastUsed: Date.now()
  };
}

/* B5: em vez de criar uma segunda linha "leite", soma na que já existe.
   Só consolida itens ainda não comprados e com a mesma unidade — senão
   "2kg batata" viraria a mesma coisa que "2 pacotes de batata palha". */
function findMergeableItem(list, name, unit){
  const key = normalizeName(name);
  return list.items.find(i=> !i.bought && normalizeName(i.name) === key && (i.unit || '') === (unit || ''));
}

function addOrMergeItem(list, fields){
  const existing = findMergeableItem(list, fields.name, fields.unit);
  if(existing){
    const a = parseFloat(String(existing.qty).replace(',', '.'));
    const b = parseFloat(String(fields.qty != null ? fields.qty : '1').replace(',', '.'));
    if(!isNaN(a) && !isNaN(b)){
      const sum = Math.round((a + b) * 1000) / 1000;
      existing.qty = String(sum);
    }
    if(existing.price == null && fields.price != null) existing.price = fields.price;
    touch(existing); touchList(list);
    updateItemHistory(existing);
    return { item: existing, merged: true };
  }
  const item = makeItem(fields);
  if(!item.category) item.category = guessCategory(item.name);
  list.items.push(item);
  touchList(list);
  updateItemHistory(item);
  return { item, merged: false };
}

/* B6: o que sugerir na próxima lista. Frequência pesa mais que recência,
   mas item usado uma vez há seis meses não deve ocupar espaço. */
function topRepurchaseSuggestions(limit){
  const hist = state.itemHistory || {};
  const now = Date.now();
  const activeNames = new Set();
  state.lists.forEach(l=> l.items.forEach(i=> activeNames.add(normalizeName(i.name))));
  return Object.keys(hist)
    .map(k=> hist[k])
    .filter(h=> h && h.name && !activeNames.has(normalizeName(h.name)))
    .map(h=>{
      const days = Math.max(1, (now - (h.lastUsed || now)) / 86400000);
      return { h, score: (h.count || 1) * (1 / Math.log2(days + 2)) };
    })
    .sort((a,b)=> b.score - a.score)
    .slice(0, limit || 8)
    .map(x=> x.h);
}

function quickAddFromHistory(list, fav){
  const res = addOrMergeItem(list, {
    name: fav.name, qty: '1', unit: fav.unit || '',
    category: fav.category || '', price: (fav.price != null ? fav.price : null)
  });
  trackEvent('item_added', { origin:'favorito' });
  saveData(); render();
  showToast(fav.name + (res.merged ? ' (quantidade somada)' : ' adicionado'));
}

/* B1: entrada rápida em um campo só. "2kg tomate" → qty 2, unidade kg, nome Tomate. */
function submitQuickAdd(list, input){
  const raw = input.value;
  if(!raw.trim()) return;
  const n = addItemsFromText(list, raw);
  input.value = '';
  const preview = document.getElementById('qaPreview');
  if(preview) preview.textContent = '';
  render();
  const again = document.getElementById('quickAddInput');
  if(again) again.focus();
  if(n > 1) showToast(n + ' itens adicionados');
}

/* B2: várias linhas de uma vez (colar do WhatsApp, ditar uma sequência etc.). */
function addItemsFromText(list, text){
  const lines = String(text)
    .split(/[\n;]+/)
    .map(s=>s.trim())
    .filter(Boolean);
  let count = 0;
  lines.forEach(line=>{
    // remove marcadores de lista colados junto ("- ", "• ", "1. ")
    const clean = line.replace(/^[-–—•*\u2022]\s*/, '').replace(/^\d+[.)]\s+/, '').trim();
    if(!clean) return;
    const p = parseQuickItem(clean);
    if(!p.name) return;
    addOrMergeItem(list, p);
    count++;
  });
  if(count){
    trackEvent('item_added', { origin: lines.length > 1 ? 'lote' : 'rapida', qtd: count });
    saveData();
  }
  return count;
}

function handleAddItem(list, catSelect){
  const nameInput = document.getElementById('newItemName');
  const qtyInput = document.getElementById('newItemQty');
  const unitSelect = document.getElementById('newItemUnit');
  const priceInput = document.getElementById('newItemPrice');
  const name = nameInput.value.trim();
  if(!name){ nameInput.focus(); return; }
  const qty = qtyInput.value.trim() || '1';
  const category = catSelect.value === '__nova__' ? '' : catSelect.value;
  const unit = unitSelect ? unitSelect.value : '';
  const priceRaw = priceInput ? priceInput.value.trim() : '';
  const price = priceRaw ? parseFloat(priceRaw.replace(',', '.')) : null;
  addOrMergeItem(list, { name, qty, unit, category, price: (price != null && !isNaN(price)) ? price : null });
  trackEvent('item_added', { origin:'formulario' });
  saveData();
  nameInput.value = '';
  qtyInput.value = '';
  if(unitSelect) unitSelect.value = '';
  if(priceInput) priceInput.value = '';
  render();
  setTimeout(()=>{
    const el = document.getElementById('newItemName');
    if(el) el.focus();
  }, 30);
}

/* =================== ARQUIVAR / RENOVAR =================== */
function archiveList(list){
  state.lists = state.lists.filter(l=>l.id !== list.id);
  const snapshot = JSON.parse(JSON.stringify(list));
  snapshot.finishedAt = Date.now();
  state.finishedLists.unshift(snapshot);
  if(state.activeListId === list.id){
    state.activeListId = state.lists.length ? state.lists[0].id : null;
  }
  trackEvent('list_finished', {
    itens: list.items.length,
    comprados: list.items.filter(i=>i.bought).length,
    recorrente: !!list.recurring.enabled
  });
}

/* C4: "Finalizar compra" tira a lista da tela e é a ação mais fácil de tocar
   sem querer no corredor. Guardamos uma foto do antes para poder voltar. */
function snapshotForUndo(){
  return JSON.stringify({
    lists: state.lists,
    finishedLists: state.finishedLists,
    activeListId: state.activeListId
  });
}
function restoreSnapshot(json){
  try{
    const s = JSON.parse(json);
    state.lists = s.lists;
    state.finishedLists = s.finishedLists;
    state.activeListId = s.activeListId;
    saveData(); render();
  }catch(e){ showToast('Não foi possível desfazer'); }
}

function pad2(n){ return String(n).padStart(2,'0'); }

function nextRecurrenceName(list){
  const base = list.baseName || list.name;
  const next = new Date(Date.now() + (list.recurring.frequencyDays || 7) * 24 * 60 * 60 * 1000);
  return { base, label: `${base} ${pad2(next.getDate())}/${pad2(next.getMonth()+1)}` };
}

function autoRenewRecurringList(list){
  const { base, label } = nextRecurrenceName(list);
  const newList = createListObject(label, true, list.recurring.frequencyDays, base);
  newList.items = list.items.map(it=> makeItem({ name: it.name, qty: it.qty, unit: it.unit||'', category: it.category, price: (it.price!=null?it.price:null) }));
  newList.location = list.location || null;
  return newList;
}

function reactivateFinishedList(id, mode){
  const idx = state.finishedLists.findIndex(l=>l.id===id);
  if(idx === -1) return;
  const [snapshot] = state.finishedLists.splice(idx,1);
  markDeleted(snapshot.id);
  const sourceItems = mode === 'pending' ? snapshot.items.filter(i=>!i.bought) : snapshot.items;
  const newList = createListObject(snapshot.name, snapshot.recurring.enabled, snapshot.recurring.frequencyDays, snapshot.baseName);
  newList.location = snapshot.location || null;
  newList.items = sourceItems.map(it=> makeItem({ name: it.name, qty: it.qty, unit: it.unit||'', category: it.category, price: (it.price!=null?it.price:null) }));
  state.lists.push(newList);
  state.activeListId = newList.id;
  saveData();
  render();
  showToast('Lista reativada');
}

          saveData();

          showToast('Histórico limpo');

/* =================== FINALIZAR COMPRA =================== */
function openFinishModal(list){
  if(list.recurring.enabled){
    openRecurringFinishModal(list);
    return;
  }

  const pending = list.items.filter(i=>!i.bought);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  if(pending.length === 0){
    overlay.innerHTML = `
      <div class="modal">
        <h2>Finalizar compra</h2>
        <p class="sub">Todos os itens foram comprados. Esta compra sairá das suas listas ativas. Deseja iniciar uma nova lista agora?</p>
        <div class="modal-buttons">
          <button id="fCancel">Apenas finalizar</button>
          <button class="primary" id="fNew">Finalizar e criar nova lista</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#fCancel').onclick = ()=>{
      const before = snapshotForUndo();
      archiveList(list);
      saveData();
      overlay.remove();
      render();
      showUndoToast('Compra finalizada', ()=> restoreSnapshot(before));
    };
    overlay.querySelector('#fNew').onclick = ()=>{
      archiveList(list);
      saveData();
      overlay.remove();
      render();
      openNewListModal([]);
    };
    return;
  }

  const keepState = {};
  pending.forEach(i=> keepState[i.id] = true);

  overlay.innerHTML = `
    <div class="modal">
      <h2>Finalizar compra</h2>
      <p class="sub">Esta compra sairá das suas listas ativas. Ainda há ${pending.length} ${pending.length===1?'item não comprado':'itens não comprados'} — eles podem iniciar uma nova lista. Toque para retirar algum item.</p>
      <div id="carryArea"></div>
      <div class="modal-buttons">
        <button id="fCancel">Cancelar</button>
        <button class="primary" id="fCreate">Finalizar compra</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const carryArea = overlay.querySelector('#carryArea');
  pending.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'carry-item';
    const catLabel = item.category ? item.category : 'Sem categoria';
    row.innerHTML = `
      <div class="ci-name">${escapeHtml(item.name)}<small>${escapeHtml(catLabel)} · ${escapeHtml(String(item.qty))}</small></div>
      <button class="carry-toggle keep" data-id="${item.id}">Manter</button>
    `;
    const btn = row.querySelector('.carry-toggle');
    btn.onclick = ()=>{
      keepState[item.id] = !keepState[item.id];
      if(keepState[item.id]){ btn.textContent='Manter'; btn.className='carry-toggle keep'; }
      else { btn.textContent='Retirado'; btn.className='carry-toggle remove'; }
    };
    carryArea.appendChild(row);
  });

  overlay.querySelector('#fCancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#fCreate').onclick = ()=>{
    const toCarry = pending.filter(i=> keepState[i.id]).map(i=>({name:i.name, qty:i.qty, unit:i.unit||'', category:i.category, price:(i.price!=null?i.price:null)}));
    const before = snapshotForUndo();
    archiveList(list);
    saveData();
    overlay.remove();
    render();
    if(toCarry.length){
      openNewListModal(toCarry);
    } else {
      showUndoToast('Compra finalizada', ()=> restoreSnapshot(before));
    }
  };
}

/* =================== COMPARTILHAR COMO TEXTO =================== */
function buildShareText(list){
  const lines = [];
  lines.push(list.name.toUpperCase());
  lines.push(new Date(list.createdAt).toLocaleDateString('pt-BR'));
  lines.push('');
  const grouped = {};
  list.items.forEach(it=>{
    if(!grouped[it.category]) grouped[it.category] = [];
    grouped[it.category].push(it);
  });
  Object.keys(grouped).sort((a,b)=>{
    if(a === '') return -1;
    if(b === '') return 1;
    return a.localeCompare(b, 'pt-BR');
  }).forEach(cat=>{
    lines.push(`— ${cat === '' ? 'Sem categoria' : cat} —`);
    grouped[cat].forEach(it=>{
      const mark = it.bought ? '[x]' : '[ ]';
      const qtyPart = it.unit ? `${it.qty}${it.unit}` : `${it.qty}x`;
      lines.push(`${mark} ${qtyPart} ${it.name}`);
    });
    lines.push('');
  });
  return lines.join('\n').trim();
}

async function shareListAsText(list){
  const text = buildShareText(list);
  if(navigator.share){
    try{
      await navigator.share({ title: list.name, text });
      return;
    }catch(e){ /* usuário cancelou ou falhou; segue para cópia */ }
  }
  try{
    await navigator.clipboard.writeText(text);
    showToast('Lista copiada para a área de transferência');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{
      document.execCommand('copy');
      showToast('Lista copiada para a área de transferência');
    }catch(err){
      showToast('Não foi possível copiar automaticamente');
    }
    ta.remove();
  }
}

/* =================== PDF =================== */
function generatePdf(list){
  if(!window.jspdf){ showToast('Erro ao carregar gerador de PDF'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:[300, 600] });
  let y = 36;
  doc.setFont('courier','bold');
  doc.setFontSize(15);
  doc.text(list.name.toUpperCase(), 150, y, { align:'center' });
  y += 18;
  doc.setFont('courier','normal');
  doc.setFontSize(9);
  doc.text(new Date(list.createdAt).toLocaleDateString('pt-BR'), 150, y, { align:'center' });
  y += 6;
  doc.setLineDashPattern([2,2], 0);
  doc.line(20, y, 280, y);
  y += 18;

  const grouped = {};
  list.items.forEach(it=>{
    if(!grouped[it.category]) grouped[it.category] = [];
    grouped[it.category].push(it);
  });

  doc.setFontSize(10);
  Object.keys(grouped).sort((a,b)=>{
    if(a === '') return -1;
    if(b === '') return 1;
    return a.localeCompare(b, 'pt-BR');
  }).forEach(cat=>{
    doc.setFont('courier','bold');
    doc.text((cat === '' ? 'SEM CATEGORIA' : cat.toUpperCase()), 20, y);
    y += 14;
    doc.setFont('courier','normal');
    grouped[cat].forEach(item=>{
      const mark = item.bought ? '[x]' : '[ ]';
      const qtyPart = item.unit ? `${item.qty}${item.unit}` : `${item.qty}x`;
      const line = `${mark} ${qtyPart}  ${item.name}`;
      doc.text(line.length > 44 ? line.slice(0,44) : line, 26, y);
      y += 14;
      if(y > 560){ doc.addPage([300,600]); y = 36; }
    });
    y += 6;
  });

  y += 4;
  doc.setLineDashPattern([2,2], 0);
  doc.line(20, y, 280, y);
  y += 16;
  const bought = list.items.filter(i=>i.bought).length;
  doc.setFont('courier','bold');
  doc.text(`TOTAL: ${bought}/${list.items.length} itens`, 150, y, { align:'center' });

  doc.save(`${list.name.replace(/[^a-z0-9]+/gi,'-').toLowerCase() || 'lista'}.pdf`);
  showToast('PDF gerado');
}
